
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Estudos</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #5c56e2;
      --primary-hover: #4a44cc;
      --success-color: #28a745;
      --error-color: #dc3545;
      --font-size: 16px;
    }

    body.high-contrast {
      --bg-color: #000000;
      --card-bg: #121212;
      --text-color: #ffffff;
      --primary-color: #ffff00;
      --primary-hover: #cccc00;
      --success-color: #00ff00;
      --error-color: #ff0000;
    }

    body {
      margin: 0;
      padding: 20px 10px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: var(--font-size);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
      padding: 24px 20px;
      position: relative;
      box-sizing: border-box;
    }

    .settings-btn {
      background: #eef0f5;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
      position: absolute;
      right: 20px;
      top: 20px;
    }

    .owl-icon {
      font-size: 42px;
      margin: 0 auto;
      display: block;
      text-align: center;
    }

    h1 {
      text-align: center;
      margin: 8px 0 16px 0;
      font-size: 1.5rem;
      color: var(--primary-color);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #eef0f5;
      color: var(--text-color);
      font-weight: bold;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: #fff;
    }

    .record-badge {
      background: #fff3cd;
      color: #856404;
      padding: 8px 12px;
      border-radius: 20px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    select, input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 1rem;
    }

    .btn-main {
      width: 100%;
      padding: 14px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-main:hover {
      background: var(--primary-hover);
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: bold;
    }

    .timer-badge {
      background: #ffe5e5;
      color: #d9534f;
      padding: 6px 12px;
      border-radius: 12px;
    }

    .question-box {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-color);
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .option-btn.correct {
      background-color: var(--success-color) !important;
      color: white !important;
      border-color: var(--success-color) !important;
    }

    .option-btn.wrong {
      background-color: var(--error-color) !important;
      color: white !important;
      border-color: var(--error-color) !important;
    }

    .gameover-box {
      background: #fff0f0;
      border: 2px solid var(--error-color);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-top: 10px;
    }

    .gameover-icon {
      font-size: 64px;
      color: var(--error-color);
      line-height: 1;
      margin-bottom: 8px;
    }

    .gameover-title {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--error-color);
      margin-bottom: 12px;
    }

    .gameover-msg {
      font-size: 1rem;
      margin-bottom: 16px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 350px;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="settings-btn" id="btnSettings" title="Acessibilidade e Configurações">⚙️</button>

    <div class="owl-icon">🦉</div>
    <h1>Quiz de Estudos</h1>

    <!-- Abas -->
    <div class="tabs" id="tabContainer">
      <button class="tab-btn active" id="tabPlay">Jogar</button>
      <button class="tab-btn" id="tabCreate">Criar Pergunta</button>
    </div>

    <!-- Tela Inicial de Seleção -->
    <div id="screenSetup">
      <div class="record-badge" id="recordDisplay">🏆 Seu Recorde: 0 pts</div>

      <div class="form-group">
        <label for="selectCategory">1. Categoria Principal:</label>
        <select id="selectCategory"></select>
      </div>

      <div class="form-group">
        <label for="selectSubject">2. Matéria / Disciplina:</label>
        <select id="selectSubject"></select>
      </div>

      <button class="btn-main" id="btnStart">Iniciar Desafio Infinito</button>
    </div>

    <!-- Tela de Jogo -->
    <div id="screenGame" style="display: none;">
      <div class="game-header">
        <span>Pontos: <span id="scoreText">0</span></span>
        <span class="timer-badge">⏱️ <span id="timerText">60</span>s</span>
      </div>

      <div class="question-box" id="questionText">A carregar pergunta...</div>

      <div class="options-grid" id="optionsContainer"></div>
    </div>

    <!-- Tela de Game Over -->
    <div id="screenGameOver" style="display: none;">
      <div class="gameover-box">
        <div class="gameover-icon">✖</div>
        <div class="gameover-title">GAME OVER</div>
        <div class="gameover-msg" id="gameOverReason">Você errou a resposta!</div>
        <p style="font-weight: bold; margin-bottom: 16px;">Pontuação Final: <span id="finalScoreText">0</span> pts</p>
        <button class="btn-main" id="btnRestart" style="background: var(--error-color);">Tentar Novamente</button>
      </div>
    </div>

    <!-- Tela de Criar Pergunta -->
    <div id="screenCreate" style="display: none;">
      <div class="form-group">
        <label>Pergunta:</label>
        <textarea id="customQText" rows="3" placeholder="Digite a pergunta..."></textarea>
      </div>
      <div class="form-group">
        <label>Opção Correta:</label>
        <input type="text" id="customCorrect" placeholder="Resposta correta">
      </div>
      <div class="form-group">
        <label>Opção Incorreta 1:</label>
        <input type="text" id="customWrong1" placeholder="Resposta errada 1">
      </div>
      <div class="form-group">
        <label>Opção Incorreta 2:</label>
        <input type="text" id="customWrong2" placeholder="Resposta errada 2">
      </div>
      <div class="form-group">
        <label>Opção Incorreta 3:</label>
        <input type="text" id="customWrong3" placeholder="Resposta errada 3">
      </div>
      <button class="btn-main" id="btnSaveCustom">Guardar Pergunta</button>
    </div>
  </div>

  <!-- Modal de Configurações -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>⚙️ Acessibilidade & Som</h3>
      <div class="setting-item">
        <span>Leitor de Voz:</span>
        <input type="checkbox" id="chkSpeech">
      </div>
      <div class="setting-item">
        <span>Música de Fundo:</span>
        <input type="checkbox" id="chkMusic">
      </div>
      <div class="setting-item">
        <span>Alto Contraste:</span>
        <input type="checkbox" id="chkContrast">
      </div>
      <div class="setting-item">
        <span>Tamanho do Texto:</span>
        <select id="selectFontSize">
          <option value="16px">Normal</option>
          <option value="18px">Grande</option>
          <option value="20px">Muito Grande</option>
        </select>
      </div>
      <button class="btn-main" id="btnCloseSettings">Fechar</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {

      // Lista Completa de Categorias e Matérias
      const catalogData = {
        "Ensino Fundamental": ["Matemática Básica", "Língua Portuguesa", "Ciências", "História Geral", "Geografia do Brasil"],
        "Ensino Médio": ["Álgebra e Geometria", "Gramática e Literatura", "Física", "Química", "Biologia", "História Geral", "Geografia do Brasil"],
        "ENEM e Vestibulares": ["Português", "Matemática", "História do Brasil", "Geografia de Minas Gerais", "Biologia", "Química", "Física"],
        "Concursos Públicos": ["Língua Portuguesa", "Direito Constitucional", "Direito Penal", "Raciocínio Lógico", "Informática", "Geografia de Minas Gerais"],
        "Línguas e Idiomas": ["Português", "Inglês", "Espanhol", "Francês", "Italiano", "Alemão", "Japonês", "Libras"],
        "Matemática e Exatas": ["Aritmética", "Matemática Financeira", "Álgebra", "Geometria Plana", "Estatística", "Lógica Matemática"],
        "Ciências da Natureza": ["Biologia", "Física", "Química", "Astronomia", "Ecologia", "Genética"],
        "Ciências Humanas e Sociais": ["Filosofia", "Sociologia", "Psicologia", "Economia", "História Antiga"],
        "Informática e Tecnologia": ["Informática Básica", "Redes e Segurança", "Programação", "Inteligência Artificial"],
        "Estudos em Geral": ["Conhecimentos Gerais", "Atualidades", "Cultura Geral", "Raciocínio Lógico"]
      };

      const questionBank = [
        { sub: "Geografia de Minas Gerais", q: "Qual é a capital do estado de Minas Gerais?", options: ["Belo Horizonte", "Uberlândia", "Ouro Preto", "Juiz de Fora"], correct: 0 },
        { sub: "Geografia de Minas Gerais", q: "Qual o principal bioma presente no norte de Minas Gerais?", options: ["Cerrado / Caatinga", "Mata Atlântica", "Pampa", "Pantanal"], correct: 0 },
        { sub: "Matemática Básica", q: "Quanto é 7 x 8?", options: ["56", "54", "48", "64"], correct: 0 },
        { sub: "Língua Portuguesa", q: "Qual o plural de 'cidadão'?", options: ["Cidadãos", "Cidadões", "Cidadães", "Cidadans"], correct: 0 },
        { sub: "Física", q: "Qual a aceleração da gravidade aproximada na Terra?", options: ["9,8 m/s²", "5,0 m/s²", "12,4 m/s²", "1,6 m/s²"], correct: 0 },
        { sub: "Direito Constitucional", q: "Qual o texto supremo do ordenamento jurídico no Brasil?", options: ["Constituição Federal de 1988", "Código Civil", "Código Penal", "CLT"], correct: 0 },
        { sub: "Inglês", q: "Como se traduz a palavra 'Book' para o português?", options: ["Livro", "Caderno", "Caneta", "Mesa"], correct: 0 }
      ];

      let currentScore = 0;
      let recordScore = parseInt(localStorage.getItem("quiz_record") || "0");
      let timer = 60;
      let timerInterval = null;
      let currentQuestion = null;
      let isAnswerLocked = false;

      // Web Audio API
      let audioCtx = null;
      let musicOsc = null;
      let musicGain = null;
      let isMusicPlaying = false;

      function initAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playSound(freq, type, duration) {
        try {
          initAudio();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch(e){}
      }

      function playCorrectSound() {
        playSound(523.25, 'triangle', 0.15);
        setTimeout(() => playSound(659.25, 'triangle', 0.25), 150);
      }

      function playWrongSound() {
        playSound(180, 'sawtooth', 0.4);
      }

      function startContinuousMusic() {
        initAudio();
        if (isMusicPlaying) return;
        
        try {
          musicOsc = audioCtx.createOscillator();
          musicGain = audioCtx.createGain();
          
          musicOsc.type = 'sine';
          musicOsc.frequency.setValueAtTime(220, audioCtx.currentTime);
          
          musicGain.gain.setValueAtTime(0.03, audioCtx.currentTime);
          
          musicOsc.connect(musicGain);
          musicGain.connect(audioCtx.destination);
          
          musicOsc.start();
          isMusicPlaying = true;
        } catch(e){}
      }

      function stopContinuousMusic() {
        if (musicOsc) {
          try {
            musicOsc.stop();
            musicOsc.disconnect();
          } catch(e){}
          musicOsc = null;
        }
        isMusicPlaying = false;
      }

      // Elementos DOM
      const selectCategory = document.getElementById("selectCategory");
      const selectSubject = document.getElementById("selectSubject");
      const recordDisplay = document.getElementById("recordDisplay");
      const btnStart = document.getElementById("btnStart");
      const screenSetup = document.getElementById("screenSetup");
      const screenGame = document.getElementById("screenGame");
      const screenGameOver = document.getElementById("screenGameOver");
      const screenCreate = document.getElementById("screenCreate");
      const tabPlay = document.getElementById("tabPlay");
      const tabCreate = document.getElementById("tabCreate");
      const questionText = document.getElementById("questionText");
      const optionsContainer = document.getElementById("optionsContainer");
      const scoreText = document.getElementById("scoreText");
      const timerText = document.getElementById("timerText");
      const finalScoreText = document.getElementById("finalScoreText");
      const gameOverReason = document.getElementById("gameOverReason");
      const btnRestart = document.getElementById("btnRestart");

      function populateCategories() {
        selectCategory.innerHTML = "";
        for (let cat in catalogData) {
          const opt = document.createElement("option");
          opt.value = cat;
          opt.textContent = cat;
          selectCategory.appendChild(opt);
        }
        updateSubjects();
      }

      function updateSubjects() {
        const cat = selectCategory.value;
        selectSubject.innerHTML = "";
        const list = catalogData[cat] || [];
        list.forEach(sub => {
          const opt = document.createElement("option");
          opt.value = sub;
          opt.textContent = sub;
          selectSubject.appendChild(opt);
        });
      }

      selectCategory.addEventListener("change", updateSubjects);
      populateCategories();

      recordDisplay.textContent = `🏆 Seu Recorde: ${recordScore} pts`;

      tabPlay.addEventListener("click", () => {
        tabPlay.classList.add("active");
        tabCreate.classList.remove("active");
        screenSetup.style.display = "block";
        screenCreate.style.display = "none";
        screenGame.style.display = "none";
        screenGameOver.style.display = "none";
      });

      tabCreate.addEventListener("click", () => {
        tabCreate.classList.add("active");
        tabPlay.classList.remove("active");
        screenSetup.style.display = "none";
        screenCreate.style.display = "block";
        screenGame.style.display = "none";
        screenGameOver.style.display = "none";
      });

      function speak(text) {
        if (document.getElementById("chkSpeech").checked && 'speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utt = new SpeechSynthesisUtterance(text);
          utt.lang = "pt-BR";
          window.speechSynthesis.speak(utt);
        }
      }

      btnStart.addEventListener("click", () => {
        initAudio();
        currentScore = 0;
        scoreText.textContent = currentScore;
        screenSetup.style.display = "none";
        screenGameOver.style.display = "none";
        screenGame.style.display = "block";
        nextQuestion();
      });

      btnRestart.addEventListener("click", () => {
        screenGameOver.style.display = "none";
        screenSetup.style.display = "block";
      });

      function startTimer() {
        clearInterval(timerInterval);
        timer = 60;
        timerText.textContent = timer;
        timerInterval = setInterval(() => {
          timer--;
          timerText.textContent = timer;
          if (timer <= 0) {
            clearInterval(timerInterval);
            triggerGameOver("O tempo acabou!");
          }
        }, 1000);
      }

      function nextQuestion() {
        isAnswerLocked = false;
        startTimer();
        const sub = selectSubject.value;

        let available = questionBank.filter(q => q.sub === sub);
        
        if (available.length === 0) {
          const num1 = Math.floor(Math.random()*15 + 1);
          const num2 = Math.floor(Math.random()*15 + 1);
          const ans = num1 + num2;
          const opts = [`${ans}`, `${ans + 2}`, `${ans - 1}`, `${ans + 4}`].sort(() => Math.random() - 0.5);
          currentQuestion = {
            q: `[${sub}] Qual o resultado de ${num1} + ${num2}?`,
            options: opts,
            correct: opts.indexOf(`${ans}`)
          };
        } else {
          currentQuestion = available[Math.floor(Math.random() * available.length)];
        }

        questionText.textContent = currentQuestion.q;
        speak(currentQuestion.q);

        optionsContainer.innerHTML = "";
        currentQuestion.options.forEach((opt, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = opt;
          btn.onclick = () => checkAnswer(idx, btn);
          optionsContainer.appendChild(btn);
        });
      }

      function checkAnswer(selectedIdx, btnElement) {
        if (isAnswerLocked) return;
        isAnswerLocked = true;
        clearInterval(timerInterval);

        const allButtons = optionsContainer.querySelectorAll(".option-btn");

        if (selectedIdx === currentQuestion.correct) {
          btnElement.classList.add("correct");
          playCorrectSound();
          currentScore += 10;
          scoreText.textContent = currentScore;
          
          if (currentScore > recordScore) {
            recordScore = currentScore;
            localStorage.setItem("quiz_record", recordScore);
            recordDisplay.textContent = `🏆 Seu Recorde: ${recordScore} pts`;
          }

          setTimeout(() => {
            nextQuestion();
          },
