<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Estudos - Parte 3 (Seletores)</title>
  
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #2d3748;
      --primary-color: #2563eb;
    }
    body {
      margin: 0; padding: 20px 10px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color); color: var(--text-color);
      display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      background-color: var(--card-bg); border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 440px; padding: 24px 20px;
      position: relative; box-sizing: border-box;
    }
    .owl-icon { font-size: 48px; text-align: center; margin-bottom: 2px; }
    h1 { text-align: center; margin: 0 0 20px 0; font-size: 1.5rem; color: var(--primary-color); }
    
    .selection-card {
      background: var(--card-bg); border: 2px solid #e2e8f0; border-radius: 12px;
      padding: 14px 16px; margin-bottom: 16px; cursor: pointer; display: flex;
      justify-content: space-between; align-items: center; font-weight: bold;
    }
    .selection-card:active { background: #f1f5f9; }
    
    .btn-main {
      width: 100%; padding: 15px; background: var(--primary-color); color: white;
      border: none; border-radius: 10px; font-size: 1.05rem; font-weight: bold; cursor: pointer;
      margin-top: 10px;
    }
    
    /* Estilos do Modal de Seleção */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background: var(--card-bg); padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center;
    }
    .picker-list { max-height: 280px; overflow-y: auto; margin-top: 10px; text-align: left; }
    .picker-item { padding: 12px; border-bottom: 1px solid #e2e8f0; cursor: pointer; font-weight: bold; }
    .picker-item:hover { background: #f8fafc; }
  </style>
</head>
<body>

  <div class="container">
    <div class="owl-icon">🦉</div>
    <h1>Quiz Multidisciplinar</h1>

    <!-- 1. Grande Área -->
    <p style="font-weight: bold; margin-bottom: 6px;">1. Grande Área:</p>
    <div class="selection-card" id="cardArea">
      <span id="labelArea">Matemática</span>
      <span>❯</span>
    </div>

    <!-- 2. Subdisciplina -->
    <p style="font-weight: bold; margin-bottom: 6px;">2. Subdisciplina Específica:</p>
    <div class="selection-card" id="cardSub">
      <span id="labelSub">Matemática básica</span>
      <span>❯</span>
    </div>

    <!-- 3. Nível de Ensino -->
    <p style="font-weight: bold; margin-bottom: 6px;">3. Nível de Ensino:</p>
    <div class="selection-card" id="cardNivel">
      <span id="labelNivel">Ensino Fundamental</span>
      <span>❯</span>
    </div>

    <button class="btn-main" id="btnIniciar">Iniciar Simulados</button>
  </div>

  <!-- Modal Genérico de Escolha -->
  <div class="modal" id="pickerModal">
    <div class="modal-content">
      <h3 id="pickerTitle" style="margin-top:0;">Selecione</h3>
      <div class="picker-list" id="pickerContainer"></div>
      <button class="btn-main" id="btnClosePicker" style="margin-top:15px;">Fechar</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Dados organizados por partes
      const baseDisciplinas = {
        "Matemática": ["Matemática básica", "Álgebra", "Geometria", "Estatística"],
        "Língua Portuguesa": ["Gramática", "Interpretação de Textos", "Redação"],
        "Ciências da Natureza": ["Biologia", "Física", "Química"]
      };

      const niveisDisponiveis = ["Ensino Fundamental", "Ensino Médio / ENEM", "Concurso Público"];

      let selectedArea = "Matemática";
      let selectedSub = "Matemática básica";
      let selectedLevel = "Ensino Fundamental";

      const modal = document.getElementById("pickerModal");
      const pickerTitle = document.getElementById("pickerTitle");
      const pickerContainer = document.getElementById("pickerContainer");

      // 1. Abrir seletor de Grande Área
      document.getElementById("cardArea").onclick = function() {
        pickerTitle.textContent = "Selecione a Grande Área";
        pickerContainer.innerHTML = "";

        Object.keys(baseDisciplinas).forEach(area => {
          let item = document.createElement("div");
          item.className = "picker-item";
          item.textContent = area;
          item.onclick = function() {
            selectedArea = area;
            document.getElementById("labelArea").textContent = area;
            // Atualiza a subdisciplina para a primeira da lista nova
            selectedSub = baseDisciplinas[area][0];
            document.getElementById("labelSub").textContent = selectedSub;
            modal.style.display = "none";
          };
          pickerContainer.appendChild(item);
        });
        modal.style.display = "flex";
      };

      // 2. Abrir seletor de Subdisciplina
      document.getElementById("cardSub").onclick = function() {
        pickerTitle.textContent = "Selecione a Subdisciplina";
        pickerContainer.innerHTML = "";

        let subs = baseDisciplinas[selectedArea] || ["Geral"];
        subs.forEach(sub => {
          let item = document.createElement("div");
          item.className = "picker-item";
          item.textContent = sub;
          item.onclick = function() {
            selectedSub = sub;
            document.getElementById("labelSub").textContent = sub;
            modal.style.display = "none";
          };
          pickerContainer.appendChild(item);
        });
        modal.style.display = "flex";
      };

      // 3. Abrir seletor de Nível
      document.getElementById("cardNivel").onclick = function() {
        pickerTitle.textContent = "Selecione o Nível";
        pickerContainer.innerHTML = "";

        niveisDisponiveis.forEach(nivel => {
          let item = document.createElement("div");
          item.className = "picker-item";
          item.textContent = nivel;
          item.onclick = function() {
            selectedLevel = nivel;
            document.getElementById("labelNivel").textContent = nivel;
            modal.style.display = "none";
          };
          pickerContainer.appendChild(item);
        });
        modal.style.display = "flex";
      };

      // Fechar modal
      document.getElementById("btnClosePicker").onclick = function() {
        modal.style.display = "none";
      };

      // Botão Iniciar (por enquanto apenas avisa que a escolha foi capturada)
      document.getElementById("btnIniciar").onclick = function() {
        alert("Configuração salva com sucesso!\nÁrea: " + selectedArea + "\nSub: " + selectedSub + "\nNível: " + selectedLevel);
      };
    });
  </script>
</body>
</html>
