
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Estudos</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #5c56e2;
      --primary-hover: #4a44cc;
      --accent-color: #ff9f43;
      --font-size: 16px;
    }

    body.high-contrast {
      --bg-color: #000000;
      --card-bg: #121212;
      --text-color: #ffffff;
      --primary-color: #ffff00;
      --primary-hover: #cccc00;
      --accent-color: #00ffff;
    }

    body {
      margin: 0;
      padding: 20px 10px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: var(--font-size);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
      padding: 24px 20px;
      position: relative;
      box-sizing: border-box;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .owl-icon {
      font-size: 42px;
      margin: 0 auto;
      display: block;
      text-align: center;
    }

    .settings-btn {
      background: #eef0f5;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
      position: absolute;
      right: 20px;
      top: 20px;
    }

    h1 {
      text-align: center;
      margin: 8px 0 16px 0;
      font-size: 1.5rem;
      color: var(--primary-color);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #eef0f5;
      color: var(--text-color);
      font-weight: bold;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: #fff;
    }

    .record-badge {
      background: #fff3cd;
      color: #856404;
      padding: 8px 12px;
      border-radius: 20px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    select, input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 1rem;
    }

    .btn-main {
      width: 100%;
      padding: 14px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-main:hover {
      background: var(--primary-hover);
    }

    /* Tela de Jogo */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: bold;
    }

    .timer-badge {
      background: #ffe5e5;
      color: #d9534f;
      padding: 6px 12px;
      border-radius: 12px;
    }

    .question-box {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-color);
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
    }

    /* Modal Acessibilidade */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 350px;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="settings-btn" id="btnSettings" title="Acessibilidade e Configurações">⚙️</button>

    <div class="owl-icon">🦉</div>
    <h1>Quiz de Estudos</h1>

    <!-- Abas -->
    <div class="tabs" id="tabContainer">
      <button class="tab-btn active" id="tabPlay">Jogar</button>
      <button class="tab-btn" id="tabCreate">Criar Pergunta</button>
    </div>

    <!-- Tela Inicial de Seleção -->
    <div id="screenSetup">
      <div class="record-badge" id="recordDisplay">🏆 Seu Recorde: 0 pts</div>

      <div class="form-group">
        <label for="selectCategory">1. Categoria Principal:</label>
        <select id="selectCategory">
          <option value="enem">ENEM / Vestibulares</option>
          <option value="concursos">Concursos Públicos</option>
          <option value="geral">Conhecimentos Gerais</option>
        </select>
      </div>

      <div class="form-group">
        <label for="selectSubject">2. Matéria / Disciplina:</label>
        <select id="selectSubject">
          <!-- Preenchido via JS -->
        </select>
      </div>

      <button class="btn-main" id="btnStart">Iniciar Desafio Infinito</button>
    </div>

    <!-- Tela de Jogo -->
    <div id="screenGame" style="display: none;">
      <div class="game-header">
        <span>Pontos: <span id="scoreText">0</span></span>
        <span class="timer-badge">⏱️ <span id="timerText">60</span>s</span>
      </div>

      <div class="question-box" id="questionText">A carregar pergunta...</div>

      <div class="options-grid" id="optionsContainer">
        <!-- Botões de opções inseridos dinamicamente -->
      </div>
    </div>

    <!-- Tela de Criar Pergunta -->
    <div id="screenCreate" style="display: none;">
      <div class="form-group">
        <label>Pergunta:</label>
        <textarea id="customQText" rows="3" placeholder="Digite a pergunta..."></textarea>
      </div>
      <div class="form-group">
        <label>Opção Correta:</label>
        <input type="text" id="customCorrect" placeholder="Resposta correta">
      </div>
      <div class="form-group">
        <label>Opção Incorreta 1:</label>
        <input type="text" id="customWrong1" placeholder="Resposta errada 1">
      </div>
      <div class="form-group">
        <label>Opção Incorreta 2:</label>
        <input type="text" id="customWrong2" placeholder="Resposta errada 2">
      </div>
      <div class="form-group">
        <label>Opção Incorreta 3:</label>
        <input type="text" id="customWrong3" placeholder="Resposta errada 3">
      </div>
      <button class="btn-main" id="btnSaveCustom">Guardar Pergunta</button>
    </div>
  </div>

  <!-- Modal de Configurações -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>⚙️ Acessibilidade & Som</h3>
      <div class="setting-item">
        <span>Leitor de Voz:</span>
        <input type="checkbox" id="chkSpeech">
      </div>
      <div class="setting-item">
        <span>Música de Fundo:</span>
        <input type="checkbox" id="chkMusic">
      </div>
      <div class="setting-item">
        <span>Alto Contraste:</span>
        <input type="checkbox" id="chkContrast">
      </div>
      <div class="setting-item">
        <span>Tamanho do Texto:</span>
        <select id="selectFontSize">
          <option value="16px">Normal</option>
          <option value="18px">Grande</option>
          <option value="20px">Muito Grande</option>
        </select>
      </div>
      <button class="btn-main" id="btnCloseSettings">Fechar</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {

      // Dados de Matérias
      const subjectsMap = {
        enem: ["Português", "Matemática", "História do Brasil", "Geografia de Minas Gerais", "Biologia", "Química", "Física"],
        concursos: ["Língua Portuguesa", "Direito Constitucional", "Raciocínio Lógico", "Informática", "Geografia de Minas Gerais"],
        geral: ["Conhecimentos Gerais", "Atualidades", "Geografia", "História"]
      };

      // Banco de Perguntas
      const questionBank = [
        { cat: "enem", sub: "Geografia de Minas Gerais", q: "Qual é a capital do estado de Minas Gerais?", options: ["Belo Horizonte", "Uberlândia", "Ouro Preto", "Juiz de Fora"], correct: 0 },
        { cat: "enem", sub: "Geografia de Minas Gerais", q: "Qual o principal bioma presente no norte de Minas Gerais?", options: ["Cerrado / Caatinga", "Mata Atlântica", "Pampa", "Pantanal"], correct: 0 },
        { cat: "enem", sub: "História do Brasil", q: "Em que ano ocorreu a Proclamação da República no Brasil?", options: ["1889", "1500", "1822", "1988"], correct: 0 },
        { cat: "enem", sub: "Matemática", q: "Qual é o resultado de 12 x 12?", options: ["144", "124", "154", "134"], correct: 0 },
        { cat: "enem", sub: "Português", q: "Qual palavra é um substantivo abstrato?", options: ["Saudade", "Mesa", "Cadeira", "Livro"], correct: 0 }
      ];

      // Estado do App
      let currentScore = 0;
      let recordScore = parseInt(localStorage.getItem("quiz_record") || "0");
      let timer = 60;
      let timerInterval = null;
      let currentQuestion = null;
      let customQuestions = JSON.parse(localStorage.getItem("custom_questions") || "[]");

      // Elementos do DOM
      const selectCategory = document.getElementById("selectCategory");
      const selectSubject = document.getElementById("selectSubject");
      const recordDisplay = document.getElementById("recordDisplay");
      const btnStart = document.getElementById("btnStart");
      const screenSetup = document.getElementById("screenSetup");
      const screenGame = document.getElementById("screenGame");
      const screenCreate = document.getElementById("screenCreate");
      const tabPlay = document.getElementById("tabPlay");
      const tabCreate = document.getElementById("tabCreate");
      const questionText = document.getElementById("questionText");
      const optionsContainer = document.getElementById("optionsContainer");
      const scoreText = document.getElementById("scoreText");
      const timerText = document.getElementById("timerText");

      // Atualizar lista de Matérias
      function updateSubjects() {
        const cat = selectCategory.value;
        selectSubject.innerHTML = "";
        const list = subjectsMap[cat] || [];
        list.forEach(sub => {
          const opt = document.createElement("option");
          opt.value = sub;
          opt.textContent = sub;
          selectSubject.appendChild(opt);
        });
      }

      selectCategory.addEventListener("change", updateSubjects);
      updateSubjects(); // Executa no carregamento inicial

      recordDisplay.textContent = `🏆 Seu Recorde: ${recordScore} pts`;

      // Navegação por Abas
      tabPlay.addEventListener("click", () => {
        tabPlay.classList.add("active");
        tabCreate.classList.remove("active");
        screenSetup.style.display = "block";
        screenCreate.style.display = "none";
        screenGame.style.display = "none";
      });

      tabCreate.addEventListener("click", () => {
        tabCreate.classList.add("active");
        tabPlay.classList.remove("active");
        screenSetup.style.display = "none";
        screenCreate.style.display = "block";
        screenGame.style.display = "none";
      });

      // Função de Falar (Acessibilidade)
      function speak(text) {
        if (document.getElementById("chkSpeech").checked && 'speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utt = new SpeechSynthesisUtterance(text);
          utt.lang = "pt-BR";
          window.speechSynthesis.speak(utt);
        }
      }

      // Iniciar Jogo
      btnStart.addEventListener("click", () => {
        currentScore = 0;
        scoreText.textContent = currentScore;
        screenSetup.style.display = "none";
        screenGame.style.display = "block";
        nextQuestion();
      });

      function startTimer() {
        clearInterval(timerInterval);
        timer = 60;
        timerText.textContent = timer;
        timerInterval = setInterval(() => {
          timer--;
          timerText.textContent = timer;
          if (timer <= 0) {
            clearInterval(timerInterval);
            gameOver("Tempo esgotado!");
          }
        }, 1000);
      }

      function nextQuestion() {
        startTimer();
        const cat = selectCategory.value;
        const sub = selectSubject.value;

        // Filtrar perguntas
        let available = questionBank.filter(q => q.sub === sub);
        if (available.length === 0) {
          // Gerador Dinâmico se não houver no banco
          currentQuestion = {
            q: `Quanto é ${Math.floor(Math.random()*20 + 1)} + ${Math.floor(Math.random()*20 + 1)}?`,
            options: ["0", "0", "0", "0"],
            correct: 0
          };
          const num1 = Math.floor(Math.random()*20 + 1);
          const num2 = Math.floor(Math.random()*20 + 1);
          const ans = num1 + num2;
          currentQuestion.q = `Qual é o resultado de ${num1} + ${num2}?`;
          currentQuestion.options = [
            `${ans}`,
            `${ans + 2}`,
            `${ans - 1}`,
            `${ans + 5}`
          ].sort(() => Math.random() - 0.5);
          currentQuestion.correct = currentQuestion.options.indexOf(`${ans}`);
        } else {
          currentQuestion = available[Math.floor(Math.random() * available.length)];
        }

        questionText.textContent = currentQuestion.q;
        speak(currentQuestion.q);

        optionsContainer.innerHTML = "";
        currentQuestion.options.forEach((opt, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = opt;
          btn.onclick = () => checkAnswer(idx);
          optionsContainer.appendChild(btn);
        });
      }

      function checkAnswer(selectedIdx) {
        clearInterval(timerInterval);
        if (selectedIdx === currentQuestion.correct) {
          currentScore += 10;
          scoreText.textContent = currentScore;
          if (currentScore > recordScore) {
            recordScore = currentScore;
            localStorage.setItem("quiz_record", recordScore);
            recordDisplay.textContent = `🏆 Seu Recorde: ${recordScore} pts`;
          }
          speak("Resposta correta!");
          nextQuestion();
        } else {
          gameOver("Resposta incorreta!");
        }
      }

      function gameOver(reason) {
        speak(`Fim de jogo. ${reason}`);
        alert(`GAME OVER! ${reason}\nSua pontuação: ${currentScore} pontos.`);
        screenGame.style.display = "none";
        screenSetup.style.display = "block";
      }

      // Guardar Pergunta Personalizada
      document.getElementById("btnSaveCustom").addEventListener("click", () => {
        const qText = document.getElementById("customQText").value;
        const correct = document.getElementById("customCorrect").value;
        const w1 = document.getElementById("customWrong1").value;
        const w2 = document.getElementById("customWrong2").value;
        const w3 = document.getElementById("customWrong3").value;

        if (!qText || !correct || !w1 || !w2 || !w3) {
          alert("Por favor, preencha todos os campos!");
          return;
        }

        const newQ = {
          cat: "enem",
          sub: "Geografia de Minas Gerais",
          q: qText,
          options: [correct, w1, w2, w3].sort(() => Math.random() - 0.5),
          correct: 0
        };
        newQ.correct = newQ.options.indexOf(correct);

        questionBank.push(newQ);
        alert("Pergunta guardada com sucesso!");
        
        document.getElementById("customQText").value = "";
        document.getElementById("customCorrect").value = "";
        document.getElementById("customWrong1").value = "";
        document.getElementById("customWrong2").value = "";
        document.getElementById("customWrong3").value = "";
      });

      // Configurações e Acessibilidade
      const btnSettings = document.getElementById("btnSettings");
      const settingsModal = document.getElementById("settingsModal");
      const btnCloseSettings = document.getElementById("btnCloseSettings");
      const chkContrast = document.getElementById("chkContrast");
      const selectFontSize = document.getElementById("selectFontSize");

      btnSettings.onclick = () => settingsModal.style.display = "flex";
      btnCloseSettings.onclick = () => settingsModal.style.display = "none";

      chkContrast.addEventListener("change", (e) => {
        if (e.target.checked) {
          document.body.classList.add("high-contrast");
        } else {
          document.body.classList.remove("high-contrast");
        }
      });

      selectFontSize.addEventListener("change", (e) => {
        document.documentElement.style.setProperty('--font-size', e.target.value);
      });

    });
  </script>
</body>
</html>
