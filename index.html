<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Estudos Leve</title>
  
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>">
  
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #2d3748;
      --primary-color: #2563eb;
      --music-bar-bg: #60a5fa;
    }
    body.high-contrast {
      --bg-color: #000000;
      --card-bg: #1a1a1a;
      --text-color: #ffffff;
      --primary-color: #ffff00;
      --music-bar-bg: #00ffff;
    }
    body {
      margin: 0; padding: 20px 10px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color); color: var(--text-color);
      display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      background-color: var(--card-bg); border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 440px; padding: 24px 20px;
      position: relative; box-sizing: border-box;
    }
    .settings-btn {
      background: #e2e8f0; border: none; border-radius: 50%; width: 40px; height: 40px;
      font-size: 20px; cursor: pointer; position: absolute; right: 20px; top: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .owl-icon { font-size: 48px; text-align: center; margin-bottom: 2px; }
    h1 { text-align: center; margin: 0 0 16px 0; font-size: 1.5rem; color: var(--primary-color); }
    .music-player-bar {
      background: var(--music-bar-bg); border-radius: 14px; padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; color: white; margin-bottom: 20px;
      cursor: pointer; font-weight: bold; font-size: 0.9rem; text-align: center; justify-content: center;
    }
    .record-badge {
      background: #fef3c7; color: #92400e; padding: 10px; border-radius: 10px;
      text-align: center; font-weight: bold; margin-bottom: 20px; font-size: 0.9rem;
    }
    .selection-card {
      background: var(--card-bg); border: 2px solid #e2e8f0; border-radius: 12px;
      padding: 14px 16px; margin-bottom: 12px; cursor: pointer; display: flex;
      justify-content: space-between; align-items: center; font-weight: bold;
    }
    .btn-main {
      width: 100%; padding: 15px; background: var(--primary-color); color: white;
      border: none; border-radius: 10px; font-size: 1.05rem; font-weight: bold; cursor: pointer;
      margin-top: 10px;
    }
    .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-weight: bold; }
    .timer-badge { background: #fee2e2; color: #991b1b; padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; }
    .question-box { font-size: 1.05rem; font-weight: 600; margin-bottom: 16px; line-height: 1.4; background: #f8fafc; padding: 16px; border-radius: 12px; border-left: 4px solid var(--primary-color); }
    .options-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .option-btn {
      padding: 14px; border: 2px solid #e2e8f0; border-radius: 10px; background: var(--card-bg);
      color: var(--text-color); text-align: left; font-size: 0.95rem; cursor: pointer; font-weight: 500;
    }
    .option-btn.pending-selection { border-color: var(--primary-color); background: #eff6ff; }
    .game-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e2e8f0; padding-top: 14px; margin-top: 10px; }
    .timer-toggle-bottom-btn {
      background: #e2e8f0; border: none; border-radius: 50%; width: 44px; height: 44px;
      font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: var(--card-bg); padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; }
    .picker-list { max-height: 280px; overflow-y: auto; margin-top: 10px; }
  </style>
</head>
<body onclick="initAudio()">

  <div class="container" onclick="event.stopPropagation()">
    <button class="settings-btn" onclick="openModal()">⚙️</button>

    <div class="owl-icon">🦉</div>
    <h1>Quiz de Estudos</h1>

    <div class="music-player-bar">
      <span>🎵 App Otimizado & Leve</span>
    </div>

    <div id="screenSetup">
      <div class="record-badge">🏆 Versão Fluida & Rápida</div>

      <p style="font-weight: bold; margin-bottom: 6px;">1. Nível de Ensino:</p>
      <div class="selection-card" onclick="openPicker('nivel')">
        <span id="labelNivel">Ensino Fundamental</span>
        <span>❯</span>
      </div>

      <button class="btn-main" onclick="startQuiz()">Iniciar Simulados</button>
    </div>

    <div id="screenGame" style="display: none;">
      <div class="game-header">
        <span id="progressIndicator">Questão 1 de 2</span>
        <span class="timer-badge" id="timerBadge">⏱️ 120s</span>
      </div>

      <div class="question-box" id="questionText">Carregando...</div>
      <div class="options-grid" id="optionsContainer"></div>

      <div class="game-footer">
        <span style="font-size: 0.85rem; font-weight: bold; color: #64748b;">Modo Sem Tempo:</span>
        <button class="timer-toggle-bottom-btn" id="timerToggleBtn" onclick="toggleTimerMode()">⏱️</button>
      </div>
    </div>
  </div>

  <div class="modal" id="pickerModal">
    <div class="modal-content">
      <h3 style="margin-top:0;">Selecione o Nível</h3>
      <div class="picker-list" id="pickerContainer"></div>
      <button class="btn-main" onclick="closePicker()">Fechar</button>
    </div>
  </div>

  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3 style="margin-top:0;">⚙️ Configurações</h3>
      <div style="margin-bottom: 15px; display:flex; justify-content:space-between; align-items:center;">
        <span>Leitor de Voz:</span>
        <input type="checkbox" id="chkScreenReader" checked onchange="isScreenReaderActive = this.checked">
      </div>
      <button class="btn-main" onclick="closeModal()">Fechar</button>
    </div>
  </div>

  <script>
    var dbQuestoes = {
      "Ensino Fundamental": [
        { pergunta: "Quanto é 45 + 38?", opcoes: ["73", "83", "93", "72"], correta: 0 },
        { pergunta: "Qual é o sinônimo da palavra 'Feliz'?", opcoes: ["Triste", "Contente", "Cansado", "Zangado"], correta: 1 }
      ]
    };

    var currentQuestIndex = 0;
    var currentTimer = null;
    var timeLeft = 120;
    var isTimerDisabled = false;
    var isScreenReaderActive = true;
    var selectedAnswerPending = null;
    var audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function speakText(text) {
      if (!isScreenReaderActive) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function openPicker(type) {
      initAudio();
      var modal = document.getElementById("pickerModal");
      var container = document.getElementById("pickerContainer");
      container.innerHTML = "";

      ["Ensino Fundamental", "ENEM", "Concurso Público"].forEach(function(n) {
        var item = document.createElement("div");
        item.className = "selection-card";
        item.textContent = n;
        item.onclick = function() {
          document.getElementById("labelNivel").textContent = n;
          speakText("Nível: " + n);
          closePicker();
        };
        container.appendChild(item);
      });
      modal.style.display = "flex";
      speakText("Selecione um nível.");
    }

    function closePicker() { document.getElementById("pickerModal").style.display = "none"; }
    function openModal() { initAudio(); document.getElementById("settingsModal").style.display = "flex"; }
    function closeModal() { document.getElementById("settingsModal").style.display = "none"; }

    function startQuiz() {
      initAudio();
      currentQuestIndex = 0;
      document.getElementById("screenSetup").style.display = 'none';
      document.getElementById("screenGame").style.display = 'block';
      speakText("Quiz iniciado com cronômetro de 2 minutos. O botão para jogar sem tempo está na parte inferior.");
      loadQuestion();
    }

    function toggleTimerMode() {
      initAudio();
      isTimerDisabled = !isTimerDisabled;
      var btn = document.getElementById("timerToggleBtn");
      var badge = document.getElementById("timerBadge");

      if (isTimerDisabled) {
        clearInterval(currentTimer);
        btn.textContent = "⏱️❌";
        badge.textContent = "♾️ Sem Tempo";
        speakText("Modo sem tempo ativado.");
      } else {
        btn.textContent = "⏱️";
        badge.textContent = "⏱️ 120s";
        setupTimer();
        speakText("Modo com tempo ativado.");
      }
    }

    function loadQuestion() {
      var lista = dbQuestoes["Ensino Fundamental"];
      if (currentQuestIndex >= lista.length) {
        alert("Parabéns! Bloco concluído.");
        speakText("Bloco concluído.");
        location.reload();
        return;
      }

      selectedAnswerPending = null;
      var q = lista[currentQuestIndex];
      document.getElementById("progressIndicator").textContent = "Questão " + (currentQuestIndex + 1) + " de " + lista.length;
      document.getElementById("questionText").textContent = q.pergunta;

      var optContainer = document.getElementById("optionsContainer");
      optContainer.innerHTML = "";
      
      var letras = ["A", "B", "C", "D"];
      var textoLeitura = "Questão " + (currentQuestIndex + 1) + ". " + q.pergunta + ". Alternativas: ";

      q.opcoes.forEach(function(opt, idx) {
        var letra = letras[idx];
        var btn = document.createElement("button");
        btn.className = "option-btn";
        btn.id = "opt-btn-" + idx;
        btn.textContent = letra + ") " + opt;
        
        btn.onclick = function() {
          handleOptionClick(idx, letra, opt, q.correta);
        };
        optContainer.appendChild(btn);
        textoLeitura += " Alternativa " + letra + ": " + opt + ".";
      });

      speakText(textoLeitura);
      setupTimer();
    }

    function handleOptionClick(idx, letra, texto, correta) {
      initAudio();
      if (selectedAnswerPending === idx) {
        selectedAnswerPending = null;
        checkAnswer(idx, correta);
      } else {
        selectedAnswerPending = idx;
        var buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(function(b) { b.classList.remove('pending-selection'); });
        document.getElementById("opt-btn-" + idx).classList.add('pending-selection');
        speakText("Alternativa " + letra + ". Você confirma e aceita a alternativa " + letra + "? Se sim, aperte mais uma vez.");
      }
    }

    function setupTimer() {
      clearInterval(currentTimer);
      if (isTimerDisabled) return;

      timeLeft = 120;
      updateTimerDisplay();
      currentTimer = setInterval(function() {
        if (isTimerDisabled) return;
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
          clearInterval(currentTimer);
          alert("Tempo esgotado!");
          speakText("Tempo esgotado.");
          currentQuestIndex++;
          loadQuestion();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      if (isTimerDisabled) return;
      var mins = Math.floor(timeLeft / 60);
      var secs = timeLeft % 60;
      document.getElementById("timerBadge").textContent = "⏱️ " + (mins > 0 ? (mins + "m " + secs + "s") : (secs + "s"));
    }

    function checkAnswer(escolhida, correta) {
      clearInterval(currentTimer);
      if (escolhida === correta) {
        alert("Resposta Correta!");
        speakText("Resposta correta!");
      } else {
        alert("Errou!");
        speakText("Resposta incorreta.");
      }
      currentQuestIndex++;
      loadQuestion();
    }
  </script>
</body>
</html>
