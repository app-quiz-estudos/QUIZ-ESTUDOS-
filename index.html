<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Estudos - Matemática</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #2d3748;
      --primary-color: #2563eb;
      --border-color: #e2e8f0;
      --badge-bg: #eff6ff;
      --badge-color: #1e40af;
      --badge-border: #bfdbfe;
    }

    body {
      margin: 0; padding: 20px 10px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color); color: var(--text-color);
      display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      background-color: var(--card-bg); border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 440px; padding: 24px 20px;
      position: relative; box-sizing: border-box;
    }
    .owl-icon { font-size: 48px; text-align: center; margin-bottom: 2px; }
    h1 { text-align: center; margin: 0 0 15px 0; font-size: 1.5rem; color: var(--primary-color); }
    
    .selection-card {
      background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 12px;
      padding: 14px 16px; margin-bottom: 12px; cursor: pointer; display: flex;
      justify-content: space-between; align-items: center; font-weight: bold;
    }
    .selection-card:active { background: #f1f5f9; }
    
    .btn-main {
      width: 100%; padding: 15px; background: var(--primary-color); color: white;
      border: none; border-radius: 10px; font-size: 1.05rem; font-weight: bold; cursor: pointer;
      margin-top: 10px;
    }
    
    .accessibility-footer-badge {
      background: var(--badge-bg); color: var(--badge-color); border: 2px solid var(--badge-border); 
      padding: 12px; border-radius: 12px; text-align: center; font-weight: bold; margin-top: 16px; 
      font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: var(--card-bg); padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; color: var(--text-color); }
    .picker-list { max-height: 280px; overflow-y: auto; margin-top: 10px; text-align: left; }
    .picker-item { padding: 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; font-weight: bold; }
    .picker-item:hover { background: #f8fafc; }

    /* Estilos do Quiz */
    .screen { display: none; }
    .screen.active { display: block; }
    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.85rem; font-weight: bold; opacity: 0.8; }
    .question-box { font-size: 1.05rem; font-weight: bold; margin-bottom: 15px; line-height: 1.4; }
    .quiz-option {
      background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 10px;
      padding: 12px 14px; margin-bottom: 10px; cursor: pointer; font-weight: bold; font-size: 0.95rem;
      display: block; width: 100%; text-align: left; box-sizing: border-box; color: var(--text-color);
    }
    .quiz-option.correct { background: #22c55e !important; color: white !important; border-color: #22c55e !important; }
    .quiz-option.incorrect { background: #ef4444 !important; color: white !important; border-color: #ef4444 !important; }
    .feedback-box { margin-top: 12px; padding: 12px; border-radius: 8px; font-size: 0.9rem; display: none; font-weight: bold; }
    .feedback-box.correct { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .feedback-box.incorrect { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  </style>
</head>
<body>

  <div class="container">
    <div class="owl-icon" aria-hidden="true">🦉</div>
    <h1>Quiz de Matemática</h1>

    <!-- Tela Inicial / Setup -->
    <div id="screenSetup" class="screen active">
      
      <p style="font-weight: bold; margin-bottom: 6px;">1. Disciplina:</p>
      <div class="selection-card">
        <span>Matemática</span>
        <span><i class="fa-solid fa-lock" style="font-size: 0.8rem; opacity: 0.6;"></i></span>
      </div>

      <p style="font-weight: bold; margin-bottom: 6px;">2. Tópico Específico:</p>
      <div class="selection-card" id="cardSub">
        <span id="labelSub">Matemática Básica e Operações</span>
        <span><i class="fa-solid fa-chevron-right"></i></span>
      </div>

      <p style="font-weight: bold; margin-bottom: 6px;">3. Nível de Ensino:</p>
      <div class="selection-card" id="cardNivel">
        <span id="labelNivel">Ensino Fundamental</span>
        <span><i class="fa-solid fa-chevron-right"></i></span>
      </div>

      <button class="btn-main" id="btnStartQuiz">
        <i class="fa-solid fa-play"></i> Iniciar Simulado (100 Questões)
      </button>

      <div class="accessibility-footer-badge">
        <span><i class="fa-solid fa-universal-access"></i></span> 
        <span>TalkBack Nativo Ativo (Modo Acessível)</span>
      </div>
    </div>

    <!-- Tela de Execução do Quiz -->
    <div id="screenQuiz" class="screen">
      <div class="quiz-header">
        <span id="quizSubjectTag">Matemática > Básica</span>
        <span id="quizCounter">Questão 1/100</span>
      </div>
      <div class="question-box" id="questionText">Carregando questão...</div>
      <div id="optionsContainer"></div>
      <div class="feedback-box" id="feedbackBox"></div>
      <button class="btn-main" id="btnNextQuestion" style="display: none; margin-top: 15px;">
        Próxima Questão <i class="fa-solid fa-chevron-right"></i>
      </button>
      <button class="btn-main" id="btnBackSetup" style="background: #64748b; margin-top: 8px;">
        <i class="fa-solid fa-arrow-left"></i> Voltar ao Menu
      </button>
    </div>
  </div>

  <!-- Modal de Seleção -->
  <div class="modal" id="pickerModal">
    <div class="modal-content">
      <h3 id="pickerTitle" style="margin-top:0;">Selecione</h3>
      <div class="picker-list" id="pickerContainer"></div>
      <button class="btn-main" id="btnClosePicker" style="margin-top:15px;">Fechar</button>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
      const topicosMatematica = [
        "Matemática Básica e Operações",
        "Frações e Números Decimais",
        "Porcentagem e Juros Simples",
        "Equações do 1º e 2º Grau",
        "Razão, Proporção e Regra de Três",
        "Geometria Plana (Áreas e Perímetros)",
        "Estatística e Média Aritmética"
      ];

      const niveisDisponíveis = ["Ensino Fundamental", "Ensino Médio / ENEM", "Concurso Público"];

      let selectedSub = topicosMatematica[0];
      let selectedLevel = "Ensino Fundamental";
      let questaoAtualIndex = 0;

      // BANCO EXCLUSIVO DE MATEMÁTICA COM 10 QUESTÕES VARIADAS REAIS
      const bancoMatematica = [
        { q: "Qual é o resultado da expressão numérica: 15 + 3 × 4 - 6?", opts: ["21", "27", "18", "36"], corr: "21", exp: "Pela ordem de operações, primeiro multiplica-se (3 × 4 = 12), depois soma-se e subtrai-se (15 + 12 - 6 = 21)." },
        { q: "Se um produto custa R$ 200,00 e sofre um desconto de 20%, qual passa a ser o seu preço final?", opts: ["R$ 160,00", "R$ 180,00", "R$ 150,00", "R$ 140,00"], corr: "R$ 160,00", exp: "O desconto de 20% sobre R$ 200,00 é de R$ 40,00. Logo, 200 - 40 = 160." },
        { q: "Qual é o valor da fração irredutível equivalente a 45/60?", opts: ["3/4", "2/3", "4/5", "5/6"], corr: "3/4", exp: "Dividindo o numerador e o denominador por 15, obtemos 3/4." },
        { q: "Qual é o MMC entre os números 4, 6 e 8?", opts: ["24", "12", "48", "16"], corr: "24", exp: "O menor múltiplo comum entre 4, 6 e 8 é 24." },
        { q: "Qual é a raiz quadrada de 144 somada com 25?", opts: ["37", "17", "29", "35"], corr: "37", exp: "A raiz de 144 é 12. Somando 25, temos 12 + 25 = 37." },
        { q: "Resolva a equação do 1º grau: 3x - 5 = 16. Qual é o valor de x?", opts: ["7", "5", "8", "6"], corr: "7", exp: "Isolando o x: 3x = 16 + 5 => 3x = 21 => x = 7." },
        { q: "Se 5 operários constroem um muro em 6 dias, quantos dias seriam necessários para 10 operários construírem o mesmo muro?", opts: ["3 dias", "12 dias", "5 dias", "4 dias"], corr: "3 dias", exp: "Grandezas inversamente proporcionais: dobrando o número de operários, o tempo cai pela metade (6 / 2 = 3)." },
        { q: "Qual é a área de um retângulo que possui 8 metros de comprimento por 5 metros de largura?", opts: ["40 metros quadrados", "26 metros quadrados", "13 metros quadrados", "45 metros quadrados"], corr: "40 metros quadrados", exp: "A área do retângulo calcula-se multiplicando base por altura (8 × 5 = 40)." },
        { q: "Qual é a média aritmética das notas: 7, 8, 9 e 6?", opts: ["7,5", "8,0", "7,0", "8,5"], corr: "7,5", exp: "Somando as notas (7+8+9+6 = 30) e dividindo por 4, temos 30 / 4 = 7,5." },
        { q: "Quanto vale 15% de 300?", opts: ["45", "30", "60", "15"], corr: "45", exp: "Calcula-se multiplicando 300 por 0,15, o que resulta em 45." }
      ];

      function gerarQuestaoMatematica(sub, nivel, index) {
        let baseObj = bancoMatematica[index % bancoMatematica.length];
        let num = index + 1;
        let enunciadoFinal = `[Questão ${num}/100 - ${nivel}] (${sub}): ${baseObj.q}`;

        let optsEmbaralhadas = [...baseObj.opts].sort(() => Math.random() - 0.5);

        return {
          enunciado: enunciadoFinal,
          opcoes: optsEmbaralhadas,
          correta: baseObj.corr,
          explicacao: baseObj.exp
        };
      }

      function carregarQuiz() {
        document.getElementById("quizSubjectTag").textContent = `Matemática > ${selectedSub}`;
        document.getElementById("quizCounter").textContent = `Questão ${questaoAtualIndex + 1}/100`;

        let q = gerarQuestaoMatematica(selectedSub, selectedLevel, questaoAtualIndex);
        document.getElementById("questionText").textContent = q.enunciado;

        let optContainer = document.getElementById("optionsContainer");
        optContainer.innerHTML = "";

        let feedbackBox = document.getElementById("feedbackBox");
        feedbackBox.style.display = "none";
        feedbackBox.className = "feedback-box";
        document.getElementById("btnNextQuestion").style.display = "none";

        q.opcoes.forEach(function(textoOpcao) {
          let btn = document.createElement("button");
          btn.className = "quiz-option";
          btn.textContent = textoOpcao;
          btn.onclick = function() {
            let todosBotoes = optContainer.querySelectorAll(".quiz-option");
            todosBotoes.forEach(b => b.disabled = true);

            if (textoOpcao === q.correta) {
              btn.classList.add("correct");
              feedbackBox.innerHTML = '<i class="fa-solid fa-check"></i> Resposta Correta! ' + q.explicacao;
              feedbackBox.className = "feedback-box correct";
            } else {
              btn.classList.add("incorrect");
              todosBotoes.forEach(b => {
                if (b.textContent === q.correta) b.classList.add("correct");
              });
              feedbackBox.innerHTML = '<i class="fa-solid fa-xmark"></i> Resposta Incorreta. ' + q.explicacao;
              feedbackBox.className = "feedback-box incorrect";
            }
            feedbackBox.style.display = "block";
            document.getElementById("btnNextQuestion").style.display = "block";
          };
          optContainer.appendChild(btn);
        });
      }

      const modal = document.getElementById("pickerModal");
      const pickerTitle = document.getElementById("pickerTitle");
      const pickerContainer = document.getElementById("pickerContainer");

      document.getElementById("cardSub").onclick = function() {
        pickerTitle.textContent = "Selecione o Tópico";
        pickerContainer.innerHTML = "";
        topicosMatematica.forEach(function(sub) {
          let item = document.createElement("div");
          item.className = "picker-item";
          item.textContent = sub;
          item.onclick = function() {
            selectedSub = sub;
            document.getElementById("labelSub").textContent = sub;
            modal.style.display = "none";
          };
          pickerContainer.appendChild(item);
        });
        modal.style.display = "flex";
      };

      document.getElementById("cardNivel").onclick = function() {
        pickerTitle.textContent = "Selecione o Nível";
        pickerContainer.innerHTML = "";
        niveisDisponíveis.forEach(function(nivel) {
          let item = document.createElement("div");
          item.className = "picker-item";
          item.textContent = nivel;
          item.onclick = function() {
            selectedLevel = nivel;
            document.getElementById("labelNivel").textContent = nivel;
            modal.style.display = "none";
          };
          pickerContainer.appendChild(item);
        });
        modal.style.display = "flex";
      };

      document.getElementById("btnClosePicker").onclick = function() {
        modal.style.display = "none";
      };

      document.getElementById("btnStartQuiz").onclick = function() {
        questaoAtualIndex = 0;
        document.getElementById("screenSetup").classList.remove("active");
        document.getElementById("screenQuiz").classList.add("active");
        carregarQuiz();
      };

      document.getElementById("btnNextQuestion").onclick = function() {
        questaoAtualIndex = (questaoAtualIndex + 1) % 100;
        carregarQuiz();
      };

      document.getElementById("btnBackSetup").onclick = function() {
        document.getElementById("screenQuiz").classList.remove("active");
        document.getElementById("screenSetup").classList.add("active");
      };
    });
  </script>
</body>
</html>
