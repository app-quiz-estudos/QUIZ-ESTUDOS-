<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Estudos - Owl Edition</title>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --text-color: #2d3748;
      --primary-color: #5c56e2;
      --primary-hover: #4a44cc;
      --success-color: #28a745;
      --error-color: #dc3545;
      --border-radius: 12px;
      --font-size: 16px;
    }

    body.high-contrast {
      --bg-color: #000000;
      --card-bg: #1a1a1a;
      --text-color: #ffffff;
      --primary-color: #ffff00;
      --primary-hover: #cccc00;
      --success-color: #00ff00;
      --error-color: #ff0000;
    }

    body {
      margin: 0;
      padding: 20px 10px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: var(--font-size);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 440px;
      padding: 24px 20px;
      position: relative;
      box-sizing: border-box;
    }

    .settings-btn {
      background: #e2e8f0;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 20px;
      cursor: pointer;
      position: absolute;
      right: 20px;
      top: 20px;
      transition: transform 0.2s;
    }

    .settings-btn:active {
      transform: scale(0.9);
    }

    .owl-icon {
      font-size: 48px;
      text-align: center;
      margin-bottom: 4px;
    }

    h1 {
      text-align: center;
      margin: 0 0 16px 0;
      font-size: 1.5rem;
      color: var(--primary-color);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: var(--border-radius);
      background: #edf2f7;
      color: var(--text-color);
      font-weight: bold;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: #fff;
    }

    .record-badge {
      background: #feebc8;
      color: #744210;
      padding: 10px;
      border-radius: var(--border-radius);
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* Design Arredondado dos Seletores */
    select, input, textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: var(--border-radius);
      box-sizing: border-box;
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 0.95rem;
      outline: none;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%205c56e2' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 16px;
    }

    textarea {
      background-image: none;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--primary-color);
    }

    .btn-main {
      width: 100%;
      padding: 15px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: bold;
    }

    .timer-badge {
      background: #fed7d7;
      color: #9b2c2c;
      padding: 6px 14px;
      border-radius: 20px;
    }

    .question-box {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
      background: #f7fafc;
      padding: 16px;
      border-radius: var(--border-radius);
      border-left: 4px solid var(--primary-color);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: var(--border-radius);
      background: var(--card-bg);
      color: var(--text-color);
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .option-btn.correct {
      background-color: var(--success-color) !important;
      color: white !important;
      border-color: var(--success-color) !important;
    }

    .option-btn.wrong {
      background-color: var(--error-color) !important;
      color: white !important;
      border-color: var(--error-color) !important;
    }

    .gameover-box {
      background: #fff5f5;
      border: 2px solid var(--error-color);
      border-radius: var(--border-radius);
      padding: 24px;
      text-align: center;
    }

    .gameover-icon {
      font-size: 60px;
      color: var(--error-color);
    }

    .gameover-title {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--error-color);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 360px;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="settings-btn" onclick="openModal()">⚙️</button>

    <div class="owl-icon">🦉</div>
    <h1>Quiz de Estudos</h1>

    <div class="tabs">
      <button class="tab-btn active" id="tabPlay" onclick="switchTab('play')">Jogar</button>
      <button class="tab-btn" id="tabCreate" onclick="switchTab('create')">Criar Pergunta</button>
    </div>

    <!-- Tela Setup -->
    <div id="screenSetup">
      <div class="record-badge" id="recordDisplay">🏆 Seu Recorde: 0 pts</div>

      <div class="form-group">
        <label>1. Categoria Principal:</label>
        <select id="selectCategory" onchange="updateSubcategories()"></select>
      </div>

      <div class="form-group">
        <label>2. Matéria / Disciplina:</label>
        <select id="selectSubject" onchange="checkGeneralOptions()"></select>
      </div>

      <!-- Opção de Dificuldade para Estudos em Geral -->
      <div class="form-group" id="groupDifficulty" style="display: none;">
        <label>3. Nível de Dificuldade:</label>
        <select id="selectDifficulty">
          <option value="facil">Fácil</option>
          <option value="medio" selected>Médio</option>
          <option value="dificil">Difícil</option>
        </select>
      </div>

      <button class="btn-main" onclick="startQuiz()">Iniciar Desafio Infinito</button>
    </div>

    <!-- Tela de Jogo -->
    <div id="screenGame" style="display: none;">
      <div class="game-header">
        <span>Pontos: <span id="scoreText">0</span></span>
        <span class="timer-badge">⏱️ <span id="timerText">60</span>s</span>
      </div>

      <div class="question-box" id="questionText">A carregar pergunta...</div>
      <div class="options-grid" id="optionsContainer"></div>
    </div>

    <!-- Tela Game Over -->
    <div id="screenGameOver" style="display: none;">
      <div class="gameover-box">
        <div class="gameover-icon">✖</div>
        <div class="gameover-title">GAME OVER</div>
        <p id="gameOverReason" style="margin: 10px 0;"></p>
        <p style="font-weight: bold; margin-bottom: 16px;">Pontuação Final: <span id="finalScoreText">0</span> pts</p>
        <button class="btn-main" style="background: var(--error-color);" onclick="resetApp()">Tentar Novamente</button>
      </div>
    </div>

    <!-- Tela Criar Pergunta -->
    <div id="screenCreate" style="display: none;">
      <div class="form-group">
        <label>Pergunta:</label>
        <textarea id="customQText" rows="3" placeholder="Digite a pergunta..."></textarea>
      </div>
      <div class="form-group">
        <label>Opção Correta:</label>
        <input type="text" id="customCorrect" placeholder="Resposta correta">
      </div>
      <div class="form-group">
        <label>Opção Incorreta 1:</label>
        <input type="text" id="customWrong1" placeholder="Resposta errada 1">
      </div>
      <div class="form-group">
        <label>Opção Incorreta 2:</label>
        <input type="text" id="customWrong2" placeholder="Resposta errada 2">
      </div>
      <div class="form-group">
        <label>Opção Incorreta 3:</label>
        <input type="text" id="customWrong3" placeholder="Resposta errada 3">
      </div>
      <button class="btn-main" onclick="saveCustomQuestion()">Guardar Pergunta</button>
    </div>
  </div>

  <!-- Configurações -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>⚙️ Acessibilidade & Som</h3>
      <div class="setting-item">
        <span>Leitor de Voz (+Tempo):</span>
        <input type="checkbox" id="chkSpeech">
      </div>
      <div class="setting-item">
        <span>Música de Fundo:</span>
        <input type="checkbox" id="chkMusic" onchange="toggleMusic(this.checked)">
      </div>
      <div class="setting-item">
        <span>Alto Contraste:</span>
        <input type="checkbox" id="chkContrast" onchange="document.body.classList.toggle('high-contrast')">
      </div>
      <button class="btn-main" onclick="closeModal()">Fechar</button>
    </div>
  </div>

      "25. Outras áreas de estudo": ["Arqueologia", "Museologia", "Biblioteconomia", "Arquivologia", "Relações públicas", "Secretariado", "Comércio", "Vendas", "Atendimento ao cliente", "Transporte e logística", "Aviação", "Navegação", "Astronáutica", "Criptografia", "Inteligência estratégica", "Perícia criminal", "Paleografia", "Numismática", "Genealogia", "Estudos de mitologia", "Folclore brasileiro", "Mitologia grega", "Mitologia nórdica", "Mitologia africana", "Estudos de culturas antigas"]
    };

    var score = 0;
    var highScore = localStorage.getItem("quiz_highscore") || 0;
    var timer = null;
    var timeLeft = 60;
    var currentQ = null;
    var isLocked = false;

    var audioCtx = null;
    var musicInterval = null;

    function populateCategories() {
      var catSelect = document.getElementById("selectCategory");
      catSelect.innerHTML = "";
      for (var cat in catalogData) {
        var opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        catSelect.appendChild(opt);
      }
      updateSubcategories();
    }

    function updateSubcategories() {
      var cat = document.getElementById("selectCategory").value;
      var subSelect = document.getElementById("selectSubject");
      subSelect.innerHTML = "";
      var list = catalogData[cat] || [];
      for (var i = 0; i < list.length; i++) {
        var opt = document.createElement("option");
        opt.value = list[i];
        opt.textContent = list[i];
        subSelect.appendChild(opt);
      }
      checkGeneralOptions();
    }

    function checkGeneralOptions() {
      var cat = document.getElementById("selectCategory").value;
      var diffGroup = document.getElementById("groupDifficulty");
      if (cat.indexOf("24.") !== -1) {
        diffGroup.style.display = "block";
      } else {
        diffGroup.style.display = "none";
      }
    }

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playTone(freq, duration) {
      try {
        initAudio();
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function toggleMusic(enable) {
      initAudio();
      if (enable) {
        var notes = [261.63, 329.63, 392.00, 523.25];
        var step = 0;
        musicInterval = setInterval(function() {
          playTone(notes[step % notes.length], 0.2);
          step++;
        }, 500);
      } else {
        clearInterval(musicInterval);
      }
    }

    function speak(text) {
      if (document.getElementById("chkSpeech").checked && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'pt-BR';
        window.speechSynthesis.speak(u);
      }
    }

    function switchTab(tab) {
      document.getElementById("screenSetup").style.display = tab === 'play' ? 'block' : 'none';
      document.getElementById("screenCreate").style.display = tab === 'create' ? 'block' : 'none';
      document.getElementById("screenGame").style.display = 'none';
      document.getElementById("screenGameOver").style.display = 'none';
      document.getElementById("tabPlay").className = tab === 'play' ? 'tab-btn active' : 'tab-btn';
      document.getElementById("tabCreate").className = tab === 'create' ? 'tab-btn active' : 'tab-btn';
    }

    function openModal() { document.getElementById("settingsModal").style.display = 'flex'; }
    function closeModal() { document.getElementById("settingsModal").style.display = 'none'; }

    function startQuiz() {
      initAudio();
      score = 0;
      document.getElementById("scoreText").textContent = score;
      document.getElementById("screenSetup").style.display = 'none';
      document.getElementById("screenGame").style.display = 'block';
      nextQuestion();
    }

    function startTimer() {
      clearInterval(timer);
      var isSpeechActive = document.getElementById("chkSpeech").checked;
      timeLeft = isSpeechActive ? 120 : 60; // 120s (2 min) se o leitor estiver ativo
      document.getElementById("timerText").textContent = timeLeft;
      
      timer = setInterval(function() {
        timeLeft--;
        document.getElementById("timerText").textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          triggerGameOver("O tempo acabou!");
        }
      }, 1000);
    }

    // Gerador Exclusivo e Contextualizado por Matéria
    function generateQuestionBySubject(sub, cat) {
      var opts = [];
      var qText = "";
      var correctIdx = 0;

      if (sub === "Libras") {
        var signs = [
          { q: "Qual o sinal correspondente ao cumprimento 'Oi / Olá' em Libras?", opts: ["👋 Balançar a mão aberta", "🤙 Mão em Y no peito", "🤞 Dedos cruzados", "🤝 Aperto de mãos"], c: 0 },
          { q: "O que representa o sinal [🤟] na Linguagem Brasileira de Sinais?", opts: ["'Eu te amo' (I Love You)", "Obrigado", "Desculpa", "Por favor"], c: 0 },
          { q: "Como é representado a letra 'A' no alfabeto dactilológico?", opts: ["Mão fechada com polegar ao lado", "Mão aberta esticada", "Indicador apontado para cima", "Dois dedos em V"], c: 0 }
        ];
        var item = signs[Math.floor(Math.random() * signs.length)];
        return { q: "[Libras] " + item.q, options: item.opts, correct: item.c };
      }

      if (sub === "Espanhol") {
        var esp = [
          { q: "Como se traduz a palavra 'Desayuno' em português?", opts: ["Café da manhã", "Almoço", "Jantar", "Sobremesa"], c: 0 },
          { q: "O que significa o falso amigo 'Polvo' em espanhol?", opts: ["Pó / Poeira", "Polvo (molusco)", "Frango", "Povo"], c: 0 }
        ];
        var itemE = esp[Math.floor(Math.random() * esp.length)];
        return { q: "[Espanhol] " + itemE.q, options: itemE.opts, correct: itemE.c };
      }

      if (cat.indexOf("8. Direito") !== -1 || cat.indexOf("9. Administração") !== -1) {
        return {
          q: "[" + sub + " - Concurso] Qual princípio rege a atuação na matéria de " + sub + "?",
          options: ["Legalidade e Impessoalidade", "Subjetividade absoluta", "Uso exclusivo de costumes", "Inexistência de norma legal"],
          correct: 0
        };
      }

      if (cat.indexOf("1. Línguas") !== -1 || cat.indexOf("3. Língua Portuguesa") !== -1) {
        return {
          q: "[" + sub + "] Assinale a alternativa gramaticalmente correta quanto ao uso em " + sub + ":",
          options: ["Emprego adequado da norma culta", "Uso de vírgula entre sujeito e verbo", " Concordância verbal incorreta", "Grafia com erro ortográfico"],
          correct: 0
        };
      }

      if (cat.indexOf("5. História") !== -1 || cat.indexOf("6. Geografia") !== -1) {
        return {
          q: "[" + sub + "] Qual o aspecto mais marcante estudado em " + sub + "?",
          options: ["Transformação territorial e eventos históricos", "Cálculos de matrizes complexas", "Reações químicas em laboratório", "Sintaxe de código Python"],
          correct: 0
        };
      }

      // Fallback dinâmico padrão
      return {
        q: "[" + sub + "] Pergunta sobre conceitos essenciais de " + sub + ":",
        options: ["Conceito correto e atualizado", "Hipótese refutada", "Definição incorreta A", "Definição incorreta B"],
        correct: 0
      };
    }

    function nextQuestion() {
      isLocked = false;
      startTimer();
      var sub = document.getElementById("selectSubject").value;
      var cat = document.getElementById("selectCategory").value;

      currentQ = generateQuestionBySubject(sub, cat);

      // Embaralhar opções
      var paired = currentQ.options.map(function(opt, idx) {
        return { text: opt, isCorrect: idx === currentQ.correct };
      });
      paired.sort(function() { return Math.random() - 0.5; });

      currentQ.options = paired.map(function(p) { return p.text; });
      currentQ.correct = paired.findIndex(function(p) { return p.isCorrect; });

      document.getElementById("questionText").textContent = currentQ.q;
      
      // Leitura da pergunta + opções se o leitor estiver ativo
      var fullTextToRead = currentQ.q + ". Opções: " + currentQ.options.join(". ");
      speak(fullTextToRead);

      var box = document.getElementById("optionsContainer");
      box.innerHTML = "";
      currentQ.options.forEach(function(opt, idx) {
        var btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.onclick = function() { checkAnswer(idx, btn); };
        box.appendChild(btn);
      });
    }

    function checkAnswer(selectedIdx, btn) {
      if (isLocked) return;
      isLocked = true;
      clearInterval(timer);

      if (selectedIdx === currentQ.correct) {
        btn.classList.add("correct");
        playTone(523.25, 0.2);
        score += 10;
        document.getElementById("scoreText").textContent = score;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem("quiz_highscore", highScore);
          document.getElementById("recordDisplay").textContent = "🏆 Seu Recorde: " + highScore + " pts";
        }
        setTimeout(nextQuestion, 1000);
      } else {
        btn.classList.add("wrong");
        playTone(180, 0.4);
        setTimeout(function() { triggerGameOver("Você errou a resposta!"); }, 1000);
      }
    }

    function triggerGameOver(reason) {
      clearInterval(timer);
      document.getElementById("screenGame").style.display = 'none';
      document.getElementById("screenGameOver").style.display = 'block';
      document.getElementById("gameOverReason").textContent = reason;
      document.getElementById("finalScoreText").textContent = score;
      speak("Fim de jogo. " + reason);
    }

    function resetApp() {
      document.getElementById("screenGameOver").style.display = 'none';
      document.getElementById("screenSetup").style.display = 'block';
    }

    function saveCustomQuestion() {
      var q = document.getElementById("customQText").value;
      var c = document.getElementById("customCorrect").value;
      var w1 = document.getElementById("customWrong1").value;
      var w2 = document.getElementById("customWrong2").value;
      var w3 = document.getElementById("customWrong3").value;

      if (!q || !c || !w1 || !w2 || !w3) {
        alert("Preencha todos os campos!");
        return;
      }

      alert("Pergunta personalizada guardada com sucesso!");
      switchTab('play');
    }

    populateCategories();
    document.getElementById("recordDisplay").textContent = "🏆 Seu Recorde: " + highScore + " pts";
  </script>
</body>
</html>
