<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Estudos</title>
  
  <style>
    body {
      margin: 0; padding: 20px 10px;
      font-family: Arial, sans-serif;
      background-color: #f4f6f9; color: #2d3748;
      display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      background-color: #ffffff; border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 440px; padding: 24px 20px;
      position: relative; box-sizing: border-box;
    }
    .settings-btn {
      background: #e2e8f0; border: none; border-radius: 50%; width: 40px; height: 40px;
      font-size: 20px; cursor: pointer; position: absolute; right: 20px; top: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .owl-icon { font-size: 48px; text-align: center; margin-bottom: 2px; }
    h1 { text-align: center; margin: 0 0 16px 0; font-size: 1.5rem; color: #2563eb; }
    .music-player-bar {
      background: #60a5fa; border-radius: 14px; padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; color: white; margin-bottom: 20px;
      cursor: pointer; font-weight: bold; font-size: 0.9rem;
    }
    .selection-card {
      background: #ffffff; border: 2px solid #e2e8f0; border-radius: 12px;
      padding: 14px 16px; margin-bottom: 12px; cursor: pointer; display: flex;
      justify-content: space-between; align-items: center; font-weight: bold;
    }
    .btn-main {
      width: 100%; padding: 15px; background: #2563eb; color: white;
      border: none; border-radius: 10px; font-size: 1.05rem; font-weight: bold; cursor: pointer;
      margin-top: 10px;
    }
    .question-box { font-size: 1.05rem; font-weight: 600; margin-bottom: 16px; line-height: 1.4; background: #f8fafc; padding: 16px; border-radius: 12px; border-left: 4px solid #2563eb; }
    .options-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .option-btn {
      padding: 14px; border: 2px solid #e2e8f0; border-radius: 10px; background: #ffffff;
      color: #2d3748; text-align: left; font-size: 0.95rem; cursor: pointer; font-weight: 500;
    }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #ffffff; padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <button class="settings-btn" onclick="abrirConfiguracoes()">⚙️</button>

    <div class="owl-icon">🦉</div>
    <h1>Quiz de Estudos</h1>

    <div class="music-player-bar" onclick="falarTexto('Áudio ativado com sucesso!')">
      <span>🎵 Toque aqui para ativar o som e voz</span>
    </div>

    <div id="screenSetup">
      <div style="background: #fef3c7; color: #92400e; padding: 10px; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 20px; font-size: 0.9rem;">
        🏆 Modo Funcional Garantido
      </div>

      <p style="font-weight: bold; margin-bottom: 6px;">1. Nível de Ensino / Prova:</p>
      <div class="selection-card" onclick="mudarNivel()">
        <span id="labelNivel">Ensino Fundamental</span>
        <span>❯</span>
      </div>

      <button class="btn-main" onclick="iniciarQuiz()">Iniciar Simulados</button>
    </div>

    <div id="screenGame" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-weight: bold;">
        <span id="progressIndicator">Questão 1 de 2</span>
        <span style="background: #fee2e2; color: #991b1b; padding: 6px 14px; border-radius: 20px; font-size: 0.9rem;">⏱️ Ativo</span>
      </div>

      <div class="question-box" id="questionText">Carregando...</div>
      <div class="options-grid" id="optionsContainer"></div>
      
      <button class="btn-main" onclick="voltarMenu()" style="background: #64748b;">Voltar ao Menu</button>
    </div>
  </div>

  <!-- Modal Configurações -->
  <div class="modal" id="modalConfig">
    <div class="modal-content">
      <h3>Configurações</h3>
      <p>Tudo a funcionar corretamente.</p>
      <button class="btn-main" onclick="fecharConfiguracoes()">Fechar</button>
    </div>
  </div>

  <script>
    var questoes = [
      { pergunta: "Quanto é 45 + 38?", opcoes: ["73", "83", "93", "72"], correta: 0 },
      { pergunta: "Qual é o sinônimo de 'Feliz'?", opcoes: ["Triste", "Contente", "Cansado", "Zangado"], correta: 1 }
    ];
    var indiceAtual = 0;

    function falarTexto(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var msg = new SpeechSynthesisUtterance(texto);
        msg.lang = 'pt-BR';
        window.speechSynthesis.speak(msg);
      }
    }

    function mudarNivel() {
      var niveis = ["Ensino Fundamental", "ENEM", "Concurso Público"];
      var atual = document.getElementById("labelNivel").innerText;
      var proximo = niveis[(niveis.indexOf(atual) + 1) % niveis.length];
      document.getElementById("labelNivel").innerText = proximo;
      falarTexto("Nível alterado para " + proximo);
    }

    function iniciarQuiz() {
      falarTexto("Iniciando simulados.");
      document.getElementById("screenSetup").style.display = "none";
      document.getElementById("screenGame").style.display = "block";
      carregarQuestao();
    }

    function carregarQuestao() {
      var q = questoes[indiceAtual];
      document.getElementById("progressIndicator").innerText = "Questão " + (indiceAtual + 1) + " de " + questoes.length;
      document.getElementById("questionText").innerText = q.pergunta;
      
      var container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      q.opcoes.forEach(function(opcao, index) {
        var btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = ["A) ", "B) ", "C) ", "D) "][index] + opcao;
        btn.onclick = function() {
          if (index === q.correta) {
            falarTexto("Resposta correta!");
            alert("Resposta Correta!");
            indiceAtual = (indiceAtual + 1) % questoes.length;
            carregarQuestao();
          } else {
            falarTexto("Resposta incorreta. Tente novamente.");
            alert("Incorreto. Tente outra vez.");
          }
        };
        container.appendChild(btn);
      });

      falarTexto(q.pergunta);
    }

    function voltarMenu() {
      document.getElementById("screenGame").style.display = "none";
      document.getElementById("screenSetup").style.display = "block";
      falarTexto("Retornado ao menu principal.");
    }

    function abrirConfiguracoes() {
      document.getElementById("modalConfig").style.display = "flex";
      falarTexto("Configurações abertas.");
    }

    function fecharConfiguracoes() {
      document.getElementById("modalConfig").style.display = "none";
    }

    window.addEventListener('click', function() {
      falarTexto("Bem-vindo ao Quiz de Estudos.");
    }, { once: true });
  </script>
</body>
</html>
<!-- App Link: https://app-quiz-estudos.github.io/QUIZ-ESTUDOS-/ -->
