<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Estudos</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #5c56e2;
      --primary-hover: #4a44cc;
      --success-color: #28a745;
      --error-color: #dc3545;
      --font-size: 16px;
    }

    body.high-contrast {
      --bg-color: #000000;
      --card-bg: #121212;
      --text-color: #ffffff;
      --primary-color: #ffff00;
      --primary-hover: #cccc00;
      --success-color: #00ff00;
      --error-color: #ff0000;
    }

    body {
      margin: 0;
      padding: 20px 10px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: var(--font-size);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
      padding: 24px 20px;
      position: relative;
      box-sizing: border-box;
    }

    .settings-btn {
      background: #eef0f5;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
      position: absolute;
      right: 20px;
      top: 20px;
    }

    .owl-icon {
      font-size: 42px;
      margin: 0 auto;
      display: block;
      text-align: center;
    }

    h1 {
      text-align: center;
      margin: 8px 0 16px 0;
      font-size: 1.5rem;
      color: var(--primary-color);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #eef0f5;
      color: var(--text-color);
      font-weight: bold;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: #fff;
    }

    .record-badge {
      background: #fff3cd;
      color: #856404;
      padding: 8px 12px;
      border-radius: 20px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    select, input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 1rem;
    }

    .btn-main {
      width: 100%;
      padding: 14px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: bold;
    }

    .timer-badge {
      background: #ffe5e5;
      color: #d9534f;
      padding: 6px 12px;
      border-radius: 12px;
    }

    .question-box {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-color);
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .option-btn.correct {
      background-color: var(--success-color) !important;
      color: white !important;
    }

    .option-btn.wrong {
      background-color: var(--error-color) !important;
      color: white !important;
    }

    .gameover-box {
      background: #fff0f0;
      border: 2px solid var(--error-color);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }

    .gameover-icon {
      font-size: 64px;
      color: var(--error-color);
    }

    .gameover-title {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--error-color);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 350px;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="settings-btn" onclick="openModal()">⚙️</button>

    <div class="owl-icon">🦉</div>
    <h1>Quiz de Estudos</h1>

    <div class="tabs">
      <button class="tab-btn active" id="tabPlay" onclick="switchTab('play')">Jogar</button>
      <button class="tab-btn" id="tabCreate" onclick="switchTab('create')">Criar Pergunta</button>
    </div>

    <!-- Tela Setup -->
    <div id="screenSetup">
      <div class="record-badge" id="recordDisplay">🏆 Seu Recorde: 0 pts</div>

      <div class="form-group">
        <label>1. Categoria Principal:</label>
        <select id="selectCategory" onchange="updateSubcategories()">
          <option value="Ensino Fundamental">Ensino Fundamental</option>
          <option value="Ensino Médio">Ensino Médio</option>
          <option value="ENEM e Vestibulares">ENEM e Vestibulares</option>
          <option value="Concursos Públicos">Concursos Públicos</option>
          <option value="Línguas e Idiomas">Línguas e Idiomas</option>
          <option value="Matemática e Exatas">Matemática e Exatas</option>
          <option value="Ciências da Natureza">Ciências da Natureza</option>
          <option value="Ciências Humanas e Sociais">Ciências Humanas e Sociais</option>
          <option value="Informática e Tecnologia">Informática e Tecnologia</option>
          <option value="Estudos em Geral">Estudos em Geral</option>
        </select>
      </div>

      <div class="form-group">
        <label>2. Matéria / Disciplina:</label>
        <select id="selectSubject"></select>
      </div>

      <button class="btn-main" onclick="startQuiz()">Iniciar Desafio Infinito</button>
    </div>

    <!-- Tela de Jogo -->
    <div id="screenGame" style="display: none;">
      <div class="game-header">
        <span>Pontos: <span id="scoreText">0</span></span>
        <span class="timer-badge">⏱️ <span id="timerText">60</span>s</span>
      </div>

      <div class="question-box" id="questionText">A carregar pergunta...</div>
      <div class="options-grid" id="optionsContainer"></div>
    </div>

    <!-- Tela Game Over -->
    <div id="screenGameOver" style="display: none;">
      <div class="gameover-box">
        <div class="gameover-icon">✖</div>
        <div class="gameover-title">GAME OVER</div>
        <p id="gameOverReason" style="margin: 10px 0;"></p>
        <p style="font-weight: bold; margin-bottom: 16px;">Pontuação Final: <span id="finalScoreText">0</span> pts</p>
        <button class="btn-main" style="background: var(--error-color);" onclick="resetApp()">Tentar Novamente</button>
      </div>
    </div>

    <!-- Tela Criar Pergunta -->
    <div id="screenCreate" style="display: none;">
      <div class="form-group">
        <label>Pergunta:</label>
        <textarea id="customQText" rows="3" placeholder="Digite a pergunta..."></textarea>
      </div>
      <div class="form-group">
        <label>Opção Correta:</label>
        <input type="text" id="customCorrect" placeholder="Resposta correta">
      </div>
      <div class="form-group">
        <label>Opção Incorreta 1:</label>
        <input type="text" id="customWrong1" placeholder="Resposta errada 1">
      </div>
      <div class="form-group">
        <label>Opção Incorreta 2:</label>
        <input type="text" id="customWrong2" placeholder="Resposta errada 2">
      </div>
      <div class="form-group">
        <label>Opção Incorreta 3:</label>
        <input type="text" id="customWrong3" placeholder="Resposta errada 3">
      </div>
      <button class="btn-main" onclick="saveCustomQuestion()">Guardar Pergunta</button>
    </div>
  </div>

  <!-- Configurações -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>⚙️ Acessibilidade & Som</h3>
      <div class="setting-item">
        <span>Leitor de Voz:</span>
        <input type="checkbox" id="chkSpeech">
      </div>
      <div class="setting-item">
        <span>Música de Fundo:</span>
        <input type="checkbox" id="chkMusic" onchange="toggleMusic(this.checked)">
      </div>
      <div class="setting-item">
        <span>Alto Contraste:</span>
        <input type="checkbox" id="chkContrast" onchange="document.body.classList.toggle('high-contrast')">
      </div>
      <button class="btn-main" onclick="closeModal()">Fechar</button>
    </div>
  </div>

  <script>
    var catalogData = {
      "Ensino Fundamental": ["Matemática Básica", "Língua Portuguesa", "Ciências", "História Geral", "Geografia do Brasil"],
      "Ensino Médio": ["Álgebra e Geometria", "Gramática e Literatura", "Física", "Química", "Biologia", "História Geral", "Geografia do Brasil"],
      "ENEM e Vestibulares": ["Português", "Matemática", "História do Brasil", "Geografia de Minas Gerais", "Biologia", "Química", "Física"],
      "Concursos Públicos": ["Língua Portuguesa", "Direito Constitucional", "Direito Penal", "Raciocínio Lógico", "Informática", "Geografia de Minas Gerais"],
      "Línguas e Idiomas": ["Português", "Inglês", "Espanhol", "Francês", "Italiano", "Alemão", "Japonês", "Libras"],
      "Matemática e Exatas": ["Aritmética", "Matemática Financeira", "Álgebra", "Geometria Plana", "Estatística", "Lógica Matemática"],
      "Ciências da Natureza": ["Biologia", "Física", "Química", "Astronomia", "Ecologia", "Genética"],
      "Ciências Humanas e Sociais": ["Filosofia", "Sociologia", "Psicologia", "Economia", "História Antiga"],
      "Informática e Tecnologia": ["Informática Básica", "Redes e Segurança", "Programação", "Inteligência Artificial"],
      "Estudos em Geral": ["Conhecimentos Gerais", "Atualidades", "Cultura Geral", "Raciocínio Lógico"]
    };

    var questionBank = [
      { sub: "Geografia de Minas Gerais", q: "Qual é a capital do estado de Minas Gerais?", options: ["Belo Horizonte", "Uberlândia", "Ouro Preto", "Juiz de Fora"], correct: 0 },
      { sub: "Matemática Básica", q: "Quanto é 7 x 8?", options: ["56", "54", "48", "64"], correct: 0 },
      { sub: "Língua Portuguesa", q: "Qual o plural de 'cidadão'?", options: ["Cidadãos", "Cidadões", "Cidadães", "Cidadans"], correct: 0 },
      { sub: "Direito Constitucional", q: "Qual o texto supremo que rege o ordenamento jurídico no Brasil?", options: ["Constituição Federal de 1988", "Código Civil", "Código Penal", "CLT"], correct: 0 }
    ];

    var score = 0;
    var highScore = localStorage.getItem("quiz_highscore") || 0;
    var timer = null;
    var timeLeft = 60;
    var currentQ = null;
    var isLocked = false;

    var audioCtx = null;
    var musicInterval = null;

    function updateSubcategories() {
      var cat = document.getElementById("selectCategory").value;
      var subSelect = document.getElementById("selectSubject");
      subSelect.innerHTML = "";
      var list = catalogData[cat] || [];
      for (var i = 0; i < list.length; i++) {
        var opt = document.createElement("option");
        opt.value = list[i];
        opt.textContent = list[i];
        subSelect.appendChild(opt);
      }
    }

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playTone(freq, duration) {
      try {
        initAudio();
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function toggleMusic(enable) {
      initAudio();
      if (enable) {
        var notes = [261.63, 329.63, 392.00, 523.25];
        var step = 0;
        musicInterval = setInterval(function() {
          playTone(notes[step % notes.length], 0.2);
          step++;
        }, 500);
      } else {
        clearInterval(musicInterval);
      }
    }

    function speak(text) {
      if (document.getElementById("chkSpeech").checked && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'pt-BR';
        window.speechSynthesis.speak(u);
      }
    }

    function switchTab(tab) {
      document.getElementById("screenSetup").style.display = tab === 'play' ? 'block' : 'none';
      document.getElementById("screenCreate").style.display = tab === 'create' ? 'block' : 'none';
      document.getElementById("screenGame").style.display = 'none';
      document.getElementById("screenGameOver").style.display = 'none';
      document.getElementById("tabPlay").className = tab === 'play' ? 'tab-btn active' : 'tab-btn';
      document.getElementById("tabCreate").className = tab === 'create' ? 'tab-btn active' : 'tab-btn';
    }

    function openModal() { document.getElementById("settingsModal").style.display = 'flex'; }
    function closeModal() { document.getElementById("settingsModal").style.display = 'none'; }

    function startQuiz() {
      initAudio();
      score = 0;
      document.getElementById("scoreText").textContent = score;
      document.getElementById("screenSetup").style.display = 'none';
      document.getElementById("screenGame").style.display = 'block';
      nextQuestion();
    }

    function startTimer() {
      clearInterval(timer);
      timeLeft = 60;
      document.getElementById("timerText").textContent = timeLeft;
      timer = setInterval(function() {
        timeLeft--;
        document.getElementById("timerText").textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          triggerGameOver("O tempo acabou!");
        }
      }, 1000);
    }

    function nextQuestion() {
      isLocked = false;
      startTimer();
      var sub = document.getElementById("selectSubject").value;
      var available = questionBank.filter(function(q) { return q.sub === sub; });

      if (available.length === 0) {
        var n1 = Math.floor(Math.random() * 10) + 1;
        var n2 = Math.floor(Math.random() * 10) + 1;
        var correctAns = n1 + n2;
        var opts = ["" + correctAns, "" + (correctAns + 2), "" + (correctAns - 1), "" + (correctAns + 3)];
        opts.sort(function() { return Math.random() - 0.5; });
        currentQ = {
          q: "[" + sub + "] Quanto é " + n1 + " + " + n2 + "?",
          options: opts,
          correct: opts.indexOf("" + correctAns)
        };
      } else {
        currentQ = available[Math.floor(Math.random() * available.length)];
      }

      document.getElementById("questionText").textContent = currentQ.q;
      speak(currentQ.q);

      var box = document.getElementById("optionsContainer");
      box.innerHTML = "";
      currentQ.options.forEach(function(opt, idx) {
        var btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.onclick = function() { checkAnswer(idx, btn); };
        box.appendChild(btn);
      });
    }

    function checkAnswer(selectedIdx, btn) {
      if (isLocked) return;
      isLocked = true;
      clearInterval(timer);

      if (selectedIdx === currentQ.correct) {
        btn.classList.add("correct");
        playTone(523.25, 0.2);
        score += 10;
        document.getElementById("scoreText").textContent = score;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem("quiz_highscore", highScore);
          document.getElementById("recordDisplay").textContent = "🏆 Seu Recorde: " + highScore + " pts";
        }
        setTimeout(nextQuestion, 1000);
      } else {
        btn.classList.add("wrong");
        playTone(180, 0.4);
        setTimeout(function() { triggerGameOver("Você errou a resposta!"); }, 1000);
      }
    }

    function triggerGameOver(reason) {
      clearInterval(timer);
      document.getElementById("screenGame").style.display = 'none';
      document.getElementById("screenGameOver").style.display = 'block';
      document.getElementById("gameOverReason").textContent = reason;
      document.getElementById("finalScoreText").textContent = score;
      speak("Fim de jogo. " + reason);
    }

    function resetApp() {
      document.getElementById("screenGameOver").style.display = 'none';
      document.getElementById("screenSetup").style.display = 'block';
    }

    function saveCustomQuestion() {
      var q = document.getElementById("customQText").value;
      var c = document.getElementById("customCorrect").value;
      var w1 = document.getElementById("customWrong1").value;
      var w2 = document.getElementById("customWrong2").value;
      var w3 = document.getElementById("customWrong3").value;

      if (!q || !c || !w1 || !w2 || !w3) {
        alert("Preencha todos os campos!");
        return;
      }

      var opts = [c, w1, w2, w3].sort(function() { return Math.random() - 0.5; });
      questionBank.push({
        sub: document.getElementById("selectSubject").value,
        q: q,
        options: opts,
        correct: opts.indexOf(c)
      });

      alert("Pergunta guardada!");
      switchTab('play');
    }

    // Execução Inicial Obrigatória
    updateSubcategories();
    document.getElementById("recordDisplay").textContent = "🏆 Seu Recorde: " + highScore + " pts";
  </script>
</body>
</html>
