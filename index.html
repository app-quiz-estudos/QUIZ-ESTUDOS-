<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Estudos - Multidisciplinar</title>
  
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>">
  
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #2d3748;
      --primary-color: #2563eb;
      --music-bar-bg: #60a5fa;
      --border-color: #e2e8f0;
      --badge-bg: #eff6ff;
      --badge-color: #1e40af;
      --badge-border: #bfdbfe;
    }

    body {
      margin: 0; padding: 20px 10px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color); color: var(--text-color);
      display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      background-color: var(--card-bg); border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 440px; padding: 24px 20px;
      position: relative; box-sizing: border-box;
    }
    .settings-btn {
      background: #e2e8f0; border: none; border-radius: 50%; width: 40px; height: 40px;
      font-size: 20px; cursor: pointer; position: absolute; right: 20px; top: 20px;
      display: flex; align-items: center; justify-content: center; z-index: 10;
    }
    .owl-icon { font-size: 48px; text-align: center; margin-bottom: 2px; }
    h1 { text-align: center; margin: 0 0 16px 0; font-size: 1.5rem; color: var(--primary-color); }
    
    .music-player-bar {
      background: var(--music-bar-bg); border-radius: 14px; padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; color: white; margin-bottom: 20px;
      cursor: pointer; font-weight: bold; font-size: 0.9rem;
    }
    .music-arrow { background: none; border: none; color: inherit; font-size: 22px; font-weight: bold; cursor: pointer; padding: 5px 10px; }
    .music-info { text-align: center; flex: 1; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .selection-card {
      background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 12px;
      padding: 14px 16px; margin-bottom: 12px; cursor: pointer; display: flex;
      justify-content: space-between; align-items: center; font-weight: bold;
    }
    .selection-card:active { background: #f1f5f9; }
    
    .btn-main {
      width: 100%; padding: 15px; background: var(--primary-color); color: white;
      border: none; border-radius: 10px; font-size: 1.05rem; font-weight: bold; cursor: pointer;
      margin-top: 10px;
    }
    
    .accessibility-footer-badge {
      background: var(--badge-bg); color: var(--badge-color); border: 2px solid var(--badge-border); 
      padding: 12px; border-radius: 12px; text-align: center; font-weight: bold; margin-top: 16px; 
      font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: var(--card-bg); padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; color: var(--text-color); }
    .picker-list { max-height: 280px; overflow-y: auto; margin-top: 10px; text-align: left; }
    .picker-item { padding: 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; font-weight: bold; }
    .picker-item:hover { background: #f8fafc; }
  </style>
</head>
<body>

  <div class="container">
    <button class="settings-btn" id="btnSettings" aria-label="Abrir Configurações">⚙️</button>

    <div class="owl-icon" aria-hidden="true">🦉</div>
    <h1>Quiz Multidisciplinar</h1>

    <!-- Player de Música -->
    <div class="music-player-bar" id="musicBar" aria-label="Barra de Música. Toque para ligar ou alternar trilha">
      <button class="music-arrow" id="musicPrev" aria-label="Música anterior">❮</button>
      <div class="music-info" id="musicTitleDisplay">🎵 Música de Fundo</div>
      <button class="music-arrow" id="musicNext" aria-label="Próxima música">❯</button>
    </div>

    <!-- Tela Inicial / Setup com Seleção Modular -->
    <div id="screenSetup">
      <p style="font-weight: bold; margin-bottom: 6px;">1. Grande Área:</p>
      <div class="selection-card" id="cardArea" aria-label="Selecionar Grande Área">
        <span id="labelArea">Matemática</span>
        <span aria-hidden="true">❯</span>
      </div>

      <p style="font-weight: bold; margin-bottom: 6px;">2. Subdisciplina Específica:</p>
      <div class="selection-card" id="cardSub" aria-label="Selecionar Subdisciplina">
        <span id="labelSub">Matemática básica</span>
        <span aria-hidden="true">❯</span>
      </div>

      <p style="font-weight: bold; margin-bottom: 6px;">3. Nível de Ensino:</p>
      <div class="selection-card" id="cardNivel" aria-label="Selecionar Nível de Ensino">
        <span id="labelNivel">Ensino Fundamental</span>
        <span aria-hidden="true">❯</span>
      </div>

      <button class="btn-main" id="btnStartQuiz" aria-label="Iniciar Simulados Infinitos">Iniciar Simulados</button>

      <!-- Distintivo de Leitor de Tela na Parte Inferior -->
      <div class="accessibility-footer-badge" aria-label="Leitor de Tela Detectado. Modo Adaptado Ativo.">
        <span>♿</span> <span>Leitor de Tela Detectado (Modo Adaptado Ativo)</span>
      </div>
    </div>
  </div>

  <!-- Modais -->
  <div class="modal" id="pickerModal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h3 id="pickerTitle" style="margin-top:0;">Selecione</h3>
      <div class="picker-list" id="pickerContainer"></div>
      <button class="btn-main" id="btnClosePicker" style="margin-top:15px;" aria-label="Fechar seletor">Fechar</button>
    </div>
  </div>

  <div class="modal" id="settingsModal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h3 style="margin-top:0;">⚙️ Configurações</h3>
      <div style="margin-bottom: 15px; display:flex; justify-content:space-between; align-items:center;">
        <span>Música de Fundo:</span>
        <input type="checkbox" id="chkMusic" checked aria-label="Ligar ou desligar música de fundo" style="width: 20px; height: 20px; cursor: pointer;">
      </div>
      <button class="btn-main" id="btnCloseSettings" aria-label="Fechar configurações">Fechar</button>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
      const baseDisciplinas = {
        "Línguas e idiomas": ["Português", "Inglês", "Espanhol", "Francês", "Italiano", "Libras", "Japonês", "Mandarim"],
        "Matemática": ["Aritmética", "Matemática básica", "Matemática financeira", "Álgebra", "Geometria plana", "Geometria espacial", "Estatística", "Probabilidade", "Funções"],
        "Língua Portuguesa e literatura": ["Gramática", "Ortografia", "Sintaxe", "Interpretação de textos", "Redação", "Literatura brasileira", "Figuras de linguagem"],
        "Ciências da natureza": ["Biologia", "Física", "Química", "Astronomia", "Ecologia", "Genética", "Botânica", "Anatomia"],
        "História": ["História geral", "História do Brasil", "História da América", "História antiga", "História medieval", "História moderna", "História contemporânea"],
        "Geografia": ["Geografia geral", "Geografia física", "Geografia humana", "Geografia do Brasil", "Cartografia", "Geopolítica", "Demografia"],
        "Ciências humanas e sociais": ["Filosofia", "Sociologia", "Antropologia", "Psicologia", "Economia", "Ética", "Direitos humanos"],
        "Direito e legislação": ["Direito Constitucional", "Direito Administrativo", "Direito Civil", "Direito Penal", "Direito do Trabalho", "Direito Tributário"],
        "Administração e recursos humanos": ["Administração geral", "Recursos Humanos", "Gestão de projetos", "Empreendedorismo", "Logística"],
        "Economia e finanças": ["Macroeconomia", "Microeconomia", "Educação financeira", "Finanças pessoais", "Contabilidade"],
        "Informática e tecnologia": ["Informática básica", "Sistemas operacionais", "Segurança da informação", "Lógica de programação", "HTML/CSS", "Python", "Banco de dados", "Inteligência artificial"],
        "Educação e pedagogia": ["Pedagogia", "Didática", "Educação infantil", "Ensino fundamental", "Educação especial", "Alfabetização"],
        "Saúde e corpo humano": ["Anatomia humana", "Fisiologia humana", "Nutrição", "Primeiros socorros", "Saúde pública", "Enfermagem"],
        "Educação física e esportes": ["Condicionamento físico", "Musculação", "Futebol", "Basquete", "Vôlei", "Natação", "Artes marciais"],
        "Artes e criatividade": ["Artes visuais", "Fotografia", "Cinema", "Teatro", "Design gráfico", "Escrita criativa"],
        "Música": ["Teoria musical", "História da música", "Canto", "Violão", "Piano", "Produção musical"],
        "Religião e teologia": ["Teologia", "História do cristianismo", "Filosofia da religião", "Estudos bíblicos"],
        "Meio ambiente e sustentabilidade": ["Ecologia", "Sustentabilidade", "Gestão ambiental", "Energias renováveis", "Reciclagem"],
        "Engenharia e áreas técnicas": ["Engenharia civil", "Engenharia mecânica", "Engenharia elétrica", "Engenharia de software", "Segurança do trabalho"],
        "Agricultura e ciências agrárias": ["Agronomia", "Zootecnia", "Medicina veterinária", "Horticultura", "Gestão rural"],
        "Segurança pública e emergência": ["Segurança pública", "Combate a incêndios", "Primeiros socorros", "Gerenciamento de crises"],
        "Turismo, hotelaria e gastronomia": ["Turismo", "Gestão hoteleira", "Gastronomia", "Culinária brasileira", "Enologia"],
        "Comunicação e marketing": ["Jornalismo", "Publicidade e propaganda", "Marketing digital", "Relações públicas", "Copywriting"],
        "Ciências e conhecimentos gerais": ["Cultura geral", "Atualidades", "Raciocínio lógico", "Metodologia científica"],
        "Outras áreas de estudo": ["Arqueologia", "Biblioteconomia", "Arquivologia", "Mitologia grega", "Folclore brasileiro"]
      };

      const niveisDisponíveis = ["Ensino Fundamental", "Ensino Médio / ENEM", "Concurso Público"];

      let selectedArea = "Matemática";
      let selectedSub = "Matemática básica";
      let selectedLevel = "Ensino Fundamental";

      let audioCtx = null;
      let musicInterval = null;
      let stepCount = 0;
      let currentSongIdx = 4;
      let isPlayingMusic = false;
      let hasUserStarted = false;

      const songList = [
        { name: "1. 👻 Terror Sombrio", type: "sawtooth", tempo: 500, baseFreq: 110 },
        { name: "2. 🦇 Mistério Noturno", type: "sine", tempo: 600, baseFreq: 146 },
        { name: "3. 🌸 Leveza Suave", type: "triangle", tempo: 400, baseFreq: 330 },
        { name: "4. 🍃 Brisa Serena", type: "sine", tempo: 450, baseFreq: 261 },
        { name: "5. 🪘 Pagode Suingado", type: "triangle", tempo: 320, baseFreq: 220 },
        { name: "6. 🥁 Pagode Raiz", type: "square", tempo: 220, baseFreq: 196 }
      ];

      function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }

      function playCustomTone(freq, duration, type='sine', vol=0.04) {
        try {
          initAudio();
          if (!audioCtx || audioCtx.state !== 'running') return;
          let osc = audioCtx.createOscillator();
          let gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(vol, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch(e){}
      }

      function playMusicLoop() {
        let chk = document.getElementById("chkMusic");
        if (!isPlayingMusic || !chk || !chk.checked) return;
        let song = songList[currentSongIdx];
        let s = stepCount % 16;
        let melodia = [song.baseFreq, 0, song.baseFreq * 1.25, song.baseFreq * 1.5, 0, song.baseFreq * 1.25, song.baseFreq, song.baseFreq * 0.8];
        if (s % 2 === 0 && melodia[(s/2) % melodia.length] > 0) {
          playCustomTone(melodia[(s/2) % melodia.length], 0.18, song.type, 0.045);
        }
        if (s === 0 || s === 8) playCustomTone(song.baseFreq * 0.5, 0.15, 'sine', 0.06);
        stepCount = (stepCount + 1) % 32;
      }

      function startMusicEngine() {
        initAudio();
        isPlayingMusic = true;
        let chk = document.getElementById("chkMusic");
        if (chk) chk.checked = true;
        let song = songList[currentSongIdx];
        if (musicInterval) clearInterval(musicInterval);
        stepCount = 0;
        musicInterval = setInterval(playMusicLoop, song.tempo);
        playMusicLoop();
        updateSongDisplay();
      }

      function updateSongDisplay() {
        let chk = document.getElementById("chkMusic");
        let isChecked = chk ? chk.checked : true;
        let el = document.getElementById("musicTitleDisplay");
        if (el) el.textContent = (isPlayingMusic && isChecked ? "▶ " : "⏸ ") + songList[currentSongIdx].name;
      }

      document.addEventListener('click', function() {
        if (!hasUserStarted) {
          hasUserStarted = true;
          startMusicEngine();
        }
      }, { once: true });

      document.getElementById("musicBar").onclick = function() { startMusicEngine(); };
      document.getElementById("musicPrev").onclick = function(e) {
        e.stopPropagation();
        initAudio();
        currentSongIdx = (currentSongIdx - 1 + songList.length) % songList.length;
        startMusicEngine();
      };
      document.getElementById("musicNext").onclick = function(e) {
        e.stopPropagation();
        initAudio();
        currentSongIdx = (currentSongIdx + 1) % songList.length;
        startMusicEngine();
      };

      document.getElementById("chkMusic").onchange = function(e) {
        initAudio();
        isPlayingMusic = e.target.checked;
        if (isPlayingMusic) {
          if (musicInterval) clearInterval(musicInterval);
          musicInterval = setInterval(playMusicLoop, songList[currentSongIdx].tempo);
          playMusicLoop();
        } else {
          clearInterval(musicInterval);
        }
        updateSongDisplay();
      };

      const modal = document.getElementById("pickerModal");
      const pickerTitle = document.getElementById("pickerTitle");
      const pickerContainer = document.getElementById("pickerContainer");

      document.getElementById("cardArea").onclick = function() {
        initAudio();
        pickerTitle.textContent = "Selecione a Grande Área";
        pickerContainer.innerHTML = "";

        Object.keys(baseDisciplinas).forEach(function(area) {
          let item = document.createElement("div");
          item.className = "picker-item";
          item.textContent = area;
          item.onclick = function() {
            selectedArea = area;
            document.getElementById("labelArea").textContent = area;
            let subs = baseDisciplinas[area];
            selectedSub = subs[0];
            document.getElementById("labelSub").textContent = selectedSub;
            modal.style.display = "none";
          };
          pickerContainer.appendChild(item);
        });
        modal.style.display = "flex";
      };

      document.getElementById("cardSub").onclick = function() {
        initAudio();
        pickerTitle.textContent = "Selecione a Subdisciplina";
        pickerContainer.innerHTML = "";

        let subs = baseDisciplinas[selectedArea] || ["Geral"];
        subs.forEach(function(sub) {
          let item = document.createElement("div");
          item.className = "picker-item";
          item.textContent = sub;
          item.onclick = function() {
            selectedSub = sub;
            document.getElementById("labelSub").textContent = sub;
            modal.style.display = "none";
          };
          pickerContainer.appendChild(item);
        });
        modal.style.display = "flex";
      };

      document.getElementById("cardNivel").onclick = function() {
        initAudio();
        pickerTitle.textContent = "Selecione o Nível";
        pickerContainer.innerHTML = "";

        niveisDisponíveis.forEach(function(nivel) {
          let item = document.createElement("div");
          item.className = "picker-item";
          item.textContent = nivel;
          item.onclick = function() {
            selectedLevel = nivel;
            document.getElementById("labelNivel").textContent = nivel;
            modal.style.display = "none";
          };
          pickerContainer.appendChild(item);
        });
        modal.style.display = "flex";
      };

      document.getElementById("btnClosePicker").onclick = function() {
        modal.style.display = "none";
      };

      document.getElementById("btnSettings").onclick = function() {
        initAudio();
        document.getElementById("settingsModal").style.display = "flex";
      };

      document.getElementById("btnCloseSettings").onclick = function() {
        document.getElementById("settingsModal").style.display = "none";
      };

      document.getElementById("btnStartQuiz").onclick = function() {
        initAudio();
        alert("Configuração pronta!\nÁrea: " + selectedArea + "\nSub: " + selectedSub + "\nNível: " + selectedLevel);
      };

      updateSongDisplay();
    });
  </script>
</body>
</html>
