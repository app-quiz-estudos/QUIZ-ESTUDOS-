<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Estudos</title>
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Quiz Estudos">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3426/3426653.png">
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Quiz%20de%20Estudos%22,%22short_name%22:%22QuizEstudos%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23ffffff%22,%22theme_color%22:%22%234f46e5%22,%22icons%22:[{%22src%22:%22https://cdn-icons-png.flaticon.com/512/3426/3426653.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]}">
  
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --success: #10b981;
      --error: #ef4444;
      --border-radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .container { background: var(--card-bg); border-radius: var(--border-radius); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); width: 100%; max-width: 500px; padding: 24px; position: relative; }
    h1 { font-size: 1.5rem; text-align: center; margin-bottom: 20px; color: var(--primary); }
    .select-subject { width: 100%; padding: 12px; border-radius: var(--border-radius); border: 2px solid #cbd5e1; font-size: 1rem; margin-bottom: 16px; outline: none; }
    .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 12px; background: #e0e7ff; border-radius: var(--border-radius); font-weight: bold; }
    .timer-container { display: flex; align-items: center; gap: 6px; color: #b91c1c; font-size: 1.1rem; }
    .question-box { margin-bottom: 20px; font-size: 1.1rem; font-weight: 600; line-height: 1.4; }
    .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .btn-option { padding: 14px; border: 2px solid #e2e8f0; border-radius: var(--border-radius); background: #ffffff; font-size: 1rem; font-weight: 500; text-align: left; cursor: pointer; transition: all 0.2s; }
    .btn-option.correct { background-color: var(--success); color: white; border-color: var(--success); }
    .btn-option.wrong { background-color: var(--error); color: white; border-color: var(--error); }
    .btn-action { width: 100%; padding: 14px; border: none; border-radius: var(--border-radius); background: var(--primary); color: white; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .hide { display: none; }
    .result-screen { text-align: center; }
    .result-screen h2 { margin-bottom: 12px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Quiz de Estudos</h1>

    <!-- Seleção de Matéria -->
    <div id="setup-screen">
      <label for="subject-select" style="font-weight:600; display:block; margin-bottom:8px;">Escolha a Matéria:</label>
      <select id="subject-select" class="select-subject">
        <option value="Geografia">Geografia (Foco Minas Gerais & Geral)</option>
        <option value="Português">Português</option>
        <option value="Matemática">Matemática</option>
        <option value="Física">Física</option>
        <option value="Química">Química</option>
        <option value="Biologia">Biologia</option>
        <option value="História">História</option>
      </select>
      <button class="btn-action" onclick="startQuiz()">Iniciar Quiz</button>
    </div>

    <!-- Ecrã de Perguntas -->
    <div id="quiz-screen" class="hide">
      <div class="hud">
        <span id="score-text">Pontos: 0</span>
        <div class="timer-container">
          ⏱️ <span id="time-text">60s</span>
        </div>
      </div>
      <div class="question-box" id="question-text">Pergunta aqui...</div>
      <div class="options" id="options-container"></div>
      <button id="next-btn" class="btn-action hide" onclick="nextQuestion()">Próxima Pergunta</button>
    </div>

    <!-- Ecrã de Resultados / Fim de Jogo -->
    <div id="result-screen" class="hide result-screen">
      <h2 id="result-title">Fim de Jogo!</h2>
      <p id="result-text" style="margin-bottom: 20px; font-size: 1.1rem;"></p>
      <button class="btn-action" onclick="restartQuiz()">Tentar Novamente</button>
    </div>
  </div>

  <script>
    // Banco de Perguntas
    const defaultQuestions = {
      "Geografia": [
        { q: "Qual é a capital do estado de Minas Gerais?", options: ["Uberlândia", "Belo Horizonte", "Juiz de Fora", "Ouro Preto"], correct: 1 },
        { q: "Qual importante relevo caracteriza grande parte do território mineiro?", options: ["Planície Costeira", "Planalto Atlântico / Serros e Serras", "Depressão Amazônica", "Pantanal"], correct: 1 },
        { q: "Qual o maior rio em extensão totalmente brasileiro que nasce em Minas Gerais?", options: ["Rio São Francisco", "Rio Doce", "Rio Grande", "Rio Paranaíba"], correct: 0 },
        { q: "Qual é o bioma predominante na região do Cerrado mineiro?", options: ["Caatinga", "Cerrado", "Mata Atlântica", "Pampa"], correct: 1 }
      ],
      "Português": [
        { q: "Qual das palavras abaixo é um substantivo?", options: ["Correr", "Bonito", "Cachorro", "Rapidamente"], correct: 2 }
      ],
      "Matemática": [
        { q: "Quanto é 7 x 8?", options: ["54", "56", "62", "48"], correct: 1 }
      ],
      "Física": [
        { q: "Qual a unidade de medida da força no Sistema Internacional (SI)?", options: ["Joule", "Pascal", "Newton", "Watt"], correct: 2 }
      ],
      "Química": [
        { q: "Qual é o símbolo químico da água?", options: ["CO2", "H2O", "O2", "NaCl"], correct: 1 }
      ],
      "Biologia": [
        { q: "Qual o gás essencial para a respiração humana?", options: ["Gás Carbônico", "Nitrogênio", "Oxigênio", "Hélio"], correct: 2 }
      ],
      "História": [
        { q: "Em que ano ocorreu a Proclamação da República no Brasil?", options: ["1500", "1822", "1889", "1945"], correct: 2 }
      ]
    };

    let currentSubject = "Geografia";
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let timer = null;
    let timeLeft = 60;

    function startQuiz() {
      currentSubject = document.getElementById("subject-select").value;
      currentQuestions = defaultQuestions[currentSubject] || [];
      currentIndex = 0;
      score = 0;

      document.getElementById("setup-screen").classList.add("hide");
      document.getElementById("result-screen").classList.add("hide");
      document.getElementById("quiz-screen").classList.remove("hide");

      loadQuestion();
    }

    function startTimer() {
      clearInterval(timer);
      timeLeft = 60;
      document.getElementById("time-text").textContent = timeLeft + "s";

      timer = setInterval(() => {
        timeLeft--;
        document.getElementById("time-text").textContent = timeLeft + "s";

        if (timeLeft <= 0) {
          clearInterval(timer);
          gameOver("⏰ O tempo acabou! Você perdeu.");
        }
      }, 1000);
    }

    function loadQuestion() {
      if (currentIndex >= currentQuestions.length) {
        clearInterval(timer);
        gameOver(`🎉 Parabéns! Você concluiu ${currentSubject} com ${score} ponto(s)!`);
        return;
      }

      startTimer();

      const q = currentQuestions[currentIndex];
      document.getElementById("score-text").textContent = `Pontos: ${score}`;
      document.getElementById("question-text").textContent = q.q;
      document.getElementById("next-btn").classList.add("hide");

      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      q.options.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.className = "btn-option";
        btn.textContent = option;
        btn.onclick = () => selectOption(index, q.correct);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex, correctIndex) {
      clearInterval(timer);
      const buttons = document.querySelectorAll(".btn-option");

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === correctIndex) {
          btn.classList.add("correct");
        } else if (idx === selectedIndex) {
          btn.classList.add("wrong");
        }
      });

      if (selectedIndex === correctIndex) {
        score++;
      }

      document.getElementById("next-btn").classList.remove("hide");
    }

    function nextQuestion() {
      currentIndex++;
      loadQuestion();
    }

    function gameOver(message) {
      clearInterval(timer);
      document.getElementById("quiz-screen").classList.add("hide");
      document.getElementById("result-screen").classList.remove("hide");
      document.getElementById("result-title").textContent = message.includes("tempo acabou") ? "Derrota!" : "Fim do Quiz!";
      document.getElementById("result-text").textContent = message;
    }

    function restartQuiz() {
      document.getElementById("result-screen").classList.add("hide");
      document.getElementById("setup-screen").classList.remove("hide");
    }
  </script>
</body>
</html>
