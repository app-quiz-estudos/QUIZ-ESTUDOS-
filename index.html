<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Estudos</title>
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiz Estudos">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3426/3426653.png">
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Quiz%20de%20Estudos%22,%22short_name%22:%22QuizEstudos%22,%22start_url%22:%22.%22,%22background_color%22:%22%23ffffff%22,%22theme_color%22:%22%234f46e5%22,%22icons%22:[{%22src%22:%22https://cdn-icons-png.flaticon.com/512/3426/3426653.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]}">
  
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --text: #1f2937;
      --border: #e5e7eb;
      --success: #10b981;
      --error: #ef4444;
      --font-scale: 1rem;
    }

    body.high-contrast {
      --bg-color: #000000;
      --card-bg: #121212;
      --primary: #fbbf24;
      --text: #ffffff;
      --border: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; font-size: var(--font-scale); }
    .container { background: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 520px; padding: 24px; position: relative; }
    
    .settings-btn-corner { 
      position: absolute; 
      top: 16px; 
      right: 16px; 
      background: #e0e7ff; 
      border: 2px solid var(--primary); 
      border-radius: 12px; 
      width: 52px; 
      height: 52px; 
      font-size: 1.4rem; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      z-index: 10;
    }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 16px; }
    .modal-content { background: var(--card-bg); color: var(--text); border-radius: 16px; width: 100%; max-width: 420px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.25); border: 2px solid var(--border); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-close { background: none; border: none; font-size: 1.6rem; font-weight: bold; cursor: pointer; color: var(--text); padding: 4px; }

    .setting-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .setting-item label { font-weight: bold; font-size: 1rem; margin: 0; }

    .header { text-align: center; margin-bottom: 20px; }
    .owl-icon { font-size: 48px; margin-bottom: 8px; display: block; }
    h1 { font-size: 1.6rem; color: var(--primary); }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: none; font-weight: bold; color: #6b7280; cursor: pointer; border-radius: 8px; font-size: 1rem; }
    .tab-btn.active { background: #e0e7ff; color: var(--primary); }

    .hud { display: flex; justify-content: space-between; align-items: center; background: #e0e7ff; color: #1f2937; padding: 12px; border-radius: 10px; font-weight: bold; margin-bottom: 16px; font-size: 1rem; }
    .timer { color: #b91c1c; font-size: 1.1rem; display: flex; align-items: center; gap: 4px; }
    .highscore-tag { background: #fef3c7; color: #d97706; padding: 6px 14px; border-radius: 20px; font-weight: bold; display: inline-block; margin-bottom: 16px; }

    label { font-weight: bold; display: block; margin: 10px 0 4px 0; font-size: 0.95rem; }
    select, input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; background: var(--card-bg); color: var(--text); }
    
    .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .btn-option { padding: 14px; border: 2px solid var(--border); border-radius: 10px; background: var(--card-bg); font-size: 1rem; text-align: left; font-weight: 500; cursor: pointer; color: var(--text); }
    .btn-option.correct { background: var(--success); color: white; border-color: var(--success); }
    .btn-option.wrong { background: var(--error); color: white; border-color: var(--error); }
    
    .btn-main { width: 100%; padding: 14px; border: none; border-radius: 10px; background: var(--primary); color: white; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .hide { display: none !important; }
  </style>
</head>
<body>

  <div class="container" role="main">
    <button class="settings-btn-corner" onclick="toggleSettingsModal()" aria-label="Acessibilidade e Configurações" title="Configurações">⚙️</button>

    <div class="header">
      <span class="owl-icon" role="img" aria-label="Coruja">🦉</span>
      <h1>Quiz de Estudos</h1>
    </div>

    <div class="nav-tabs" id="tab-bar">
      <button class="tab-btn active" id="btn-tab-play" onclick="switchTab('play')">Jogar</button>
      <button class="tab-btn" id="btn-tab-create" onclick="switchTab('create')">Criar Pergunta</button>
    </div>

    <div id="play-screen">
      <div id="setup-view" style="text-align: center;">
        <div class="highscore-tag">🏆 Seu Recorde: <span id="top-score-display">0</span> pts</div>
        
        <div style="text-align: left;">
          <label for="category-select">1. Categoria Principal:</label>
          <select id="category-select" onchange="updateSubcategories('play')"></select>

          <label for="subcategory-select">2. Matéria / Disciplina:</label>
          <select id="subcategory-select"></select>
        </div>

        <button class="btn-main" onclick="startQuiz()">Iniciar Desafio Infinito</button>
      </div>

      <div id="quiz-view" class="hide">
        <div class="hud">
          <span id="score-display">Pontos: 0</span>
          <div class="timer">⏱️ <span id="time-display">60s</span></div>
        </div>
        <h3 id="question-text" style="margin-bottom: 16px;"></h3>
        <div class="options" id="options-box"></div>
        <button class="btn-main" style="background: #6b7280; margin-top: 8px;" onclick="speakCurrentText()">🔊 Ouvir Pergunta Novamente</button>
      </div>

      <div id="result-view" class="hide" style="text-align: center;">
        <h2 id="result-title" style="color: var(--error); margin-bottom: 12px;">💥 ELIMINADO!</h2>
        <p id="result-msg" style="margin-bottom: 16px; font-size: 1.05rem;"></p>
        <p style="font-weight: bold; color: var(--primary); margin-bottom: 20px;">🏆 Maior Recorde: <span id="record-in-game">0</span> pontos</p>
        <button class="btn-main" onclick="resetToSetup()">Tentar Novamente</button>
      </div>
    </div>

    <div id="create-screen" class="hide">
      <h3 style="margin-bottom: 12px;">Adicionar Pergunta</h3>
      
      <label for="create-category-select">Categoria:</label>
      <select id="create-category-select" onchange="updateSubcategories('create')"></select>

      <label for="create-subcategory-select">Matéria / Disciplina:</label>
      <select id="create-subcategory-select"></select>

      <label for="custom-subcat-input">Nova Matéria Personalizada (opcional):</label>
      <input type="text" id="custom-subcat-input" placeholder="Ex: Minha Matéria Especial">

      <label for="new-q">Pergunta:</label>
      <input type="text" id="new-q" placeholder="Digite a pergunta">
      
      <label>Opções de Resposta:</label>
      <input type="text" id="opt0" placeholder="Opção 1 (Correta)">
      <input type="text" id="opt1" placeholder="Opção 2 (Incorreta)">
      <input type="text" id="opt2" placeholder="Opção 3 (Incorreta)">
      <input type="text" id="opt3" placeholder="Opção 4 (Incorreta)">
      
      <button class="btn-main" onclick="saveCustomQuestion()">Guardar Pergunta</button>
    </div>
  </div>

  <div id="settings-modal" class="modal-overlay hide">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title" style="color: var(--primary);">♿ Acessibilidade e Som</h3>
        <button class="modal-close" onclick="toggleSettingsModal()">✖</button>
      </div>

      <div class="setting-item">
        <label for="voice-toggle">🔊 Leitor Automático de Voz:</label>
        <input type="checkbox" id="voice-toggle" style="width: 26px; height: 26px; cursor: pointer;" onchange="toggleVoiceSetting()">
      </div>

      <div class="setting-item">
        <label for="music-toggle">🎵 Música de Fundo:</label>
        <input type="checkbox" id="music-toggle" style="width: 26px; height: 26px; cursor: pointer;" onchange="toggleAudioSetting()">
      </div>

      <div class="setting-item">
        <label for="contrast-toggle">👁️ Modo Alto Contraste:</label>
        <input type="checkbox" id="contrast-toggle" style="width: 26px; height: 26px; cursor: pointer;" onchange="toggleContrast()">
      </div>

      <div class="setting-item" style="border: none;">
        <label>🔍 Tamanho da Fonte:</label>
        <div style="display: flex; gap: 8px;">
          <button onclick="changeFontSize(0.1)" style="padding: 8px 14px; font-weight: bold; cursor: pointer; border-radius: 6px;">A+</button>
          <button onclick="changeFontSize(-0.1)" style="padding: 8px 14px; font-weight: bold; cursor: pointer; border-radius: 6px;">A-</button>
        </div>
      </div>

      <button class="btn-main" onclick="toggleSettingsModal()">Salvar e Voltar</button>
    </div>
  </div>

  <script>
    const catalogData = {
      "Línguas e Idiomas": ["Português", "Inglês", "Espanhol", "Francês", "Italiano", "Alemão", "Japonês", "Libras"],
      "Matemática": ["Aritmética", "Matemática Básica", "Matemática Financeira", "Álgebra", "Geometria Plana", "Estatística", "Lógica Matemática"],
      "Língua Portuguesa e Literatura": ["Gramática", "Ortografia", "Sintaxe", "Interpretação de Textos", "Literatura Brasileira"],
      "Ciências da Natureza": ["Biologia", "Física", "Química", "Astronomia", "Ecologia", "Genética"],
      "História": ["História Geral", "História do Brasil", "História de Minas Gerais", "História Antiga"],
      "Geografia": ["Geografia Geral", "Geografia do Brasil", "Geografia de Minas Gerais", "Geopolítica"],
      "Ciências Humanas e Sociais": ["Filosofia", "Sociologia", "Psicologia", "Economia"],
      "Direito e Legislação": ["Direito Constitucional", "Direito Penal", "Direitos Humanos", "Legislação de Trânsito"],
      "Informática e Tecnologia": ["Informática Básica", "Redes e Segurança", "Programação", "Inteligência Artificial"],
      "Outras Áreas": ["Conhecimentos Gerais", "Cultura Geral", "Raciocínio Lógico"]
    };

    const realQuestionsBank = {
      "Geografia de Minas Gerais": [
        { q: "Qual é a capital do estado de Minas Gerais?", options: ["Belo Horizonte", "Uberlândia", "Juiz de Fora", "Ouro Preto"], correct: 0 },
        { q: "Qual rio de grande extensão nasce na Serra da Canastra em MG?", options: ["Rio São Francisco", "Rio Doce", "Rio Grande", "Rio Paraná"], correct: 0 },
        { q: "Qual bioma é predominante na região central e norte de Minas Gerais?", options: ["Cerrado", "Caatinga", "Mata Atlântica", "Pampa"], correct: 0 }
      ],
      "Geografia do Brasil": [
        { q: "Qual é o maior estado brasileiro em extensão territorial?", options: ["Amazonas", "Pará", "Mato Grosso", "Minas Gerais"], correct: 0 }
      ],
      "Português": [
        { q: "Qual das palavras abaixo é um substantivo abstrato?", options: ["Saudade", "Cadeira", "Livro", "Caneta"], correct: 0 }
      ],
      "Inglês": [
        { q: "Como se diz 'Livro' em inglês?", options: ["Book", "Pencil", "Door", "Water"], correct: 0 }
      ],
      "História do Brasil": [
        { q: "Em que ano ocorreu a Proclamação da República no Brasil?", options: ["1889", "1500", "1822", "1988"], correct: 0 }
      ],
      "Biologia": [
        { q: "Qual é a unidade fundamental da vida em todos os seres vivos?", options: ["Célula", "Átomo", "Molécula", "Órgão"], correct: 0 }
      ],
      "Química": [
        { q: "Qual é a fórmula química da água?", options: ["H2O", "CO2", "NaCl", "O2"], correct: 0 }
      ],
      "Física": [
        { q: "Qual é a unidade de medida da força no Sistema Internacional?", options: ["Newton", "Joule", "Watt", "Pascal"], correct: 0 }
      ]
    };

    let audioCtx = null;
    let isMusicOn = false;
    let isVoiceOn = false;
    let musicInterval = null;
    let currentScale = 1;
    let customQuestions = {};
    let currentCategory = "";
    let currentSubcategory = "";
    let score = 0;
    let highScore = localStorage.getItem("quiz_highscore") || 0;
    let timer = null;
    let timeLeft = 60;

    function populateCategories() {
      const playCatSelect = document.getElementById("category-select");
      const createCatSelect = document.getElementById("create-category-select");
      if(!playCatSelect || !createCatSelect) return;
      playCatSelect.innerHTML = "";
      createCatSelect.innerHTML = "";

      for (let cat in catalogData) {
        playCatSelect.add(new Option(cat, cat));
        createCatSelect.add(new Option(cat, cat));
      }
    }

    function updateSubcategories(mode) {
      const catSelect = mode === 'play' ? document.getElementById("category-select") : document.getElementById("create-category-select");
      const subSelect = mode === 'play' ? document.getElementById("subcategory-select") : document.getElementById("create-subcategory-select");
      if(!catSelect || !subSelect) return;
      
      const selectedCat = catSelect.value;
      subSelect.innerHTML = "";

      if (catalogData[selectedCat]) {
        catalogData[selectedCat].forEach(sub => {
          subSelect.add(new Option(sub, sub));
        });
      }
    }

    function initApp() {
      populateCategories();
      updateSubcategories('play');
      updateSubcategories('create');
      const topScore = document.getElementById("top-score-display");
      if (topScore) topScore.textContent = highScore;
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function toggleSettingsModal() {
      const modal = document.getElementById("settings-modal");
      modal.classList.toggle("hide");
    }

    function toggleVoiceSetting() {
      isVoiceOn = document.getElementById("voice-toggle").checked;
      if (isVoiceOn) speakText("Leitor de voz ativado.");
    }

    function toggleAudioSetting() {
      initAudio();
      isMusicOn = document.getElementById("music-toggle").checked;
      
      if (isMusicOn) {
        let notes = [261.63, 329.63, 392.00, 523.25];
        let step = 0;
        musicInterval = setInterval(() => {
          playTone(notes[step % notes.length], 'sine', 0.4);
          step++;
        }, 500);
      } else {
        clearInterval(musicInterval);
      }
    }

    function toggleContrast() {
      document.body.classList.toggle("high-contrast");
    }

    function changeFontSize(delta) {
      currentScale += delta;
      if (currentScale < 0.8) currentScale = 0.8;
      if (currentScale > 1.4) currentScale = 1.4;
      document.documentElement.style.setProperty('--font-scale', currentScale + 'rem');
    }

    function playTone(freq, type, duration) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function playSoundEffect(type) {
      initAudio();
      if (type === 'correct') {
        playTone(523.25, 'triangle', 0.15);
        setTimeout(() => playTone(659.25, 'triangle', 0.25), 150);
      } else if (type === 'wrong') {
        playTone(180, 'sawtooth', 0.3);
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        window.speechSynthesis.speak(utterance);
      }
    }

    function speakCurrentText() {
      const qText = document.getElementById("question-text").textContent;
      if (qText) {
        let fullSpeech = qText + ". Opções: ";
        const btns = document.querySelectorAll(".btn-option");
        btns.forEach((b, i) => { fullSpeech += `Opção ${i+1}: ${b.textContent}. `; });
        speakText(fullSpeech);
      }
    }

    function switchTab(tab) {
      document.getElementById('btn-tab-play').classList.toggle('active', tab === 'play');
      document.getElementById('btn-tab-create').classList.toggle('active', tab === 'create');
      document.getElementById('play-screen').classList.toggle('hide', tab !== 'play');
      document.getElementById('create-screen').classList.toggle('hide', tab !== 'create');
    }

    function startQuiz() {
      initAudio();
      currentCategory = document.getElementById("category-select").value;
      currentSubcategory = document.getElementById("subcategory-select").value;
      score = 0;

      document.getElementById("setup-view").classList.add("hide");
      document.getElementById("result-view").classList.add("hide");
      document.getElementById("quiz-view").classList.remove("hide");

      loadQuestion();
    }

    function startTimer() {
      clearInterval(timer);
      timeLeft = 60;
      document.getElementById("time-display").textContent = timeLeft + "s";

      timer = setInterval(() => {
        timeLeft--;
        document.getElementById("time-display").textContent = timeLeft + "s";
        if (timeLeft <= 0) {
          clearInterval(timer);
          gameOver("⏰ O tempo acabou!");
        }
      }, 1000);
    }

    function getRandomQuestion(subcat) {
      if (customQuestions[subcat] && customQuestions[subcat].length > 0) {
        const randIndex = Math.floor(Math.random() * customQuestions[subcat].length);
        return customQuestions[subcat][randIndex];
      }

      if (realQuestionsBank[subcat] && realQuestionsBank[subcat].length > 0) {
        const randIndex = Math.floor(Math.random() * realQuestionsBank[subcat].length);
        return realQuestionsBank[subcat][randIndex];
      }

      const numA = Math.floor(Math.random() * 20) + 1;
      const numB = Math.floor(Math.random() * 20) + 1;
      return {
        q: `[${subcat}] Teste Rápido: Quanto é ${numA} + ${numB}?`,
        options: [`${numA + numB}`, `${numA + numB + 2}`, `${numA + numB - 1}`, `${numA + numB + 4}`],
        correct: 0
      };
    }

    function loadQuestion() {
      startTimer();
      const q = getRandomQuestion(currentSubcategory);

      document.getElementById("score-display").textContent = `Pontos: ${score}`;
      document.getElementById("question-text").textContent = q.q;

      const box = document.getElementById("options-box");
      box.innerHTML = "";

      let optionsList = q.options.map((text, idx) => ({ text, isCorrect: idx === q.correct }));
      optionsList.sort(() => Math.random() - 0.5);

      opti
